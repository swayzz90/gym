        <button class="row" data-a="go" data-view="data"><div class="row-main"><div class="row-title">Backup und Daten</div><div class="row-sub">${backupDue() ? '<span class="warn-dot"></span>' : ''}${esc(backupHint())}</div></div>${ICON.chev}</button>
      </div>`;
  },

  plan({ id }) {
    const p = findPlan(id); if (!p) return null;
    const edit = ui.edit === 'plan:' + id;
    let body;
    if (edit) {
      body = `<div class="rows">${p.days.map((dId, i) => {
        const d = S.days[dId]; if (!d) return '';
        return `<div class="erow"><div class="erow-name">${esc(d.name)}</div><div class="erow-actions">
          <button class="icon-btn" data-a="day-move" data-plan="${id}" data-i="${i}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Nach oben">${ICON.up}</button>
          <button class="icon-btn" data-a="day-move" data-plan="${id}" data-i="${i}" data-dir="1" ${i === p.days.length - 1 ? 'disabled' : ''} aria-label="Nach unten">${ICON.down}</button>
          <button class="icon-btn" data-a="day-rename" data-id="${dId}" aria-label="Umbenennen">${ICON.pen}</button>
          <button class="icon-btn danger" data-a="day-delete" data-plan="${id}" data-id="${dId}" aria-label="Löschen">${ICON.trash}</button></div></div>`;
      }).join('')}</div>
      ${S.currentPlan !== id ? `<button class="btn btn-primary" data-a="plan-current" data-id="${id}">Als aktuellen Plan festlegen</button>` : ''}
      <button class="btn" data-a="plan-rename" data-id="${id}">Plan umbenennen</button>
      <button class="btn btn-danger" data-a="plan-delete" data-id="${id}">Plan löschen</button>`;
    } else {
      body = `<div class="rows">${p.days.map(dId => {
        const d = S.days[dId]; if (!d) return '';
        const last = lastDayDate(dId), n = d.exercises.length, live = !!activeFor(dId);
        return `<button class="day ${live ? 'is-today' : ''}" data-a="open-day" data-id="${dId}"><span class="day-name">${esc(d.name)}</span><span class="day-meta">${live ? 'läuft' : (last ? rel(last) : 'neu')}<br>${n} ${n === 1 ? 'Übung' : 'Übungen'}</span></button>`;
      }).join('')}</div><button class="btn btn-line" data-a="day-add" data-plan="${id}">${ICON.plus}Tag hinzufügen</button>
      ${p.days.some(dId => S.days[dId] && S.days[dId].exercises.length) ? `<button class="btn" style="margin-top:22px" data-a="plan-analyse" data-id="${id}">Plan analysieren</button>` : ''}`;
    }
    return `${bar({ back: 'Training', right: `<button class="bar-btn" data-a="edit-toggle" data-key="plan:${id}">${edit ? 'Fertig' : 'Bearbeiten'}</button>` })}
      <h1 class="title">${esc(p.name)}</h1>${edit ? '<p class="lead">Tage sortieren, umbenennen oder löschen.</p>' : (S.currentPlan === id ? '<p class="lead"><span class="tag">Aktueller Plan</span></p>' : '')}${body}`;
  },

  day({ id }) {
    const d = S.days[id]; if (!d) return null;
    const plan = S.plans.find(p => p.days.includes(id));
    const edit = ui.edit === 'day:' + id;
    const sess = activeFor(id);
    const past = finishedFor(id);
    const total = sess ? sessionSets(sess) : 0;
    const last = past[0];
    let lead;
    if (edit) lead = 'Reihenfolge ändern oder Übungen aus diesem Tag entfernen. In deinen Übungen bleiben sie erhalten.';
    else if (sess) lead = `Einheit läuft seit <b data-since="${sess.start}">${fmtDur(Date.now() - sess.start)}</b>, ${total} ${total === 1 ? 'Satz' : 'Sätze'} abgehakt`;
    else lead = last ? `Letzte Einheit ${rel(last.date)}` : 'Noch keine Einheit';
    const list = d.exercises.map((exId, i) => {
      const ex = S.exercises[exId]; if (!ex) return '';
      if (edit) return `<div class="erow">${thumb(ex)}<div class="erow-name">${esc(ex.name)}</div><div class="erow-actions">
          <button class="icon-btn" data-a="ex-move" data-day="${id}" data-i="${i}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Nach oben">${ICON.up}</button>
          <button class="icon-btn" data-a="ex-move" data-day="${id}" data-i="${i}" data-dir="1" ${i === d.exercises.length - 1 ? 'disabled' : ''} aria-label="Nach unten">${ICON.down}</button>
          <button class="icon-btn danger" data-a="ex-remove" data-day="${id}" data-i="${i}" aria-label="Aus diesem Tag entfernen">${ICON.x}</button></div></div>`;
      const n = sess ? doneSets(sess.entries[exId]).length : 0;
      const lp = lastPerformance(exId, id);
      const sub = n ? `<span class="done-dot"></span>${n} ${n === 1 ? 'Satz' : 'Sätze'} erledigt` : esc(mainMuscle(ex)) + (lp ? `, zuletzt ${esc(setStr(topSet(lp.sets), ex.type))}` : '');
      return `<button class="row" data-a="open-ex" data-day="${id}" data-id="${exId}">${thumb(ex)}<div class="row-main"><div class="row-title">${esc(ex.name)}</div><div class="row-sub">${sub}</div></div>${ICON.chev}</button>`;
    }).join('');
    const note = edit ? '' : fold('dnote:' + id, 'Notiz zum Tag', `<textarea class="field note-field" data-field="note-day" data-id="${id}" placeholder="z. B. Schulter zwickt, heute leichter">${esc(d.note)}</textarea>`, !!(d.note || '').trim());
    const hist = edit || !past.length ? '' : fold('units:' + id, `Vergangene Einheiten (${past.length})`, `<div class="rows">${past.map(x => {
      const n = sessionSets(x), v = sessionVolume(x);
      return `<button class="row unit-row" data-a="open-session" data-id="${x.id}">${x.photos && x.photos.length ? `<div class="thumb"><img data-img="${esc(x.photos[0])}" alt=""></div>` : ''}<div class="row-main"><div class="row-title">${esc(fmtDay(x.start))}</div><div class="row-sub">${x.legacy ? '' : fmtDur(x.end - x.start) + ', '}${n} ${n === 1 ? 'Satz' : 'Sätze'}${v ? ', ' + fmtKg(v) : ''}</div></div>${ICON.chev}</button>`;
    }).join('')}</div>`);
    const startBtn = edit ? '' : (sess
      ? `<div class="photo-bar">${(sess.photos || []).map(pid => `<button class="photo-thumb" data-a="photo-menu" data-sess="${sess.id}" data-id="${esc(pid)}"><img data-img="${esc(pid)}" alt=""></button>`).join('')}<button class="photo-add" data-a="photo-add" data-sess="${sess.id}">${ICON.cam}<span>${sess.photos && sess.photos.length ? 'Noch ein Foto' : 'Foto zur Einheit'}</span></button></div>`
      : `<button class="btn btn-primary btn-start" data-a="session-start" data-day="${id}">Einheit starten</button>`);
    return `${bar({ back: plan ? plan.name : 'Zurück', right: d.exercises.length ? `<button class="bar-btn" data-a="edit-toggle" data-key="day:${id}">${edit ? 'Fertig' : 'Bearbeiten'}</button>` : '' })}
      <h1 class="title">${esc(d.name)}</h1><p class="lead">${lead}</p>
      ${d.exercises.length ? startBtn : ''}
      ${note}${hist}
      ${d.exercises.length ? `<div class="rows" style="margin-top:${edit ? 0 : 18}px">${list}</div>` : '<p class="muted">Noch keine Übungen an diesem Tag.</p>'}
      ${edit ? '' : `<button class="btn btn-line" data-a="ex-add" data-day="${id}">${ICON.plus}Übung hinzufügen</button>`}
      ${sess && !edit ? `<button class="btn btn-primary" style="margin-top:22px" data-a="session-finish" data-day="${id}">Einheit abschließen</button>` : ''}`;
  },

  ex({ id, day }) {
    const ex = S.exercises[id]; if (!ex) return null;
    const d = S.days[day];
    const l = libOf(ex);
    const idx = d ? d.exercises.indexOf(id) : -1;
    const nextId = d && idx > -1 && idx < d.exercises.length - 1 ? d.exercises[idx + 1] : null;
    const next = nextId ? S.exercises[nextId] : null;
    const hist = exHistory(id, 12);
    let hero;
    if (ex.image) hero = `<div class="hero"><img data-img="${esc(ex.image)}" data-ex="${id}" alt="" ${ex.imgRatio ? `style="aspect-ratio:${ex.imgRatio}"` : ''}></div>`;
    else if (l && l.img) hero = `<div class="hero">${netImg(l.img + '/0.jpg', 'lib-hero', "this.closest('.hero').remove()")}</div>`;
    else hero = `<button class="hero-empty" data-a="ex-edit" data-id="${id}">${ICON.img}Bild hinzufügen</button>`;
    const tags = ex.prim.map(m => `<span class="tag">${esc(m)}</span>`).join('') + ex.sec.map(m => `<span class="tag sec">${esc(m)}</span>`).join('') + (ex.type === 'bw' ? '<span class="tag">Körpergewicht</span>' : '');
    const maxSets = Math.max(0, ...hist.map(h => h.sets.length));
    const multi = new Set(hist.map(h => h.dayId)).size > 1 || daysWith(id).length > 1;
    const grid = hist.length ? `<div class="hgrid-wrap"><table class="hgrid"><thead><tr><th>Datum</th>${Array.from({ length: maxSets }, (_, i) => `<th>Satz ${i + 1}</th>`).join('')}</tr></thead><tbody>${hist.map(h => `<tr data-a="open-session" data-id="${h.id}"><td class="hdate">${esc(rel(h.date))}${multi && S.days[h.dayId] ? `<span class="hday">${esc(S.days[h.dayId].name)}</span>` : ''}</td>${Array.from({ length: maxSets }, (_, i) => { const r = h.sets[i]; return `<td>${r ? esc(setStr(r, ex.type)) + (r.drops || []).map(x => `<span class="dr">↘ ${esc(setStr(x, ex.type))}</span>`).join('') : ''}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>` : '';
    return `${bar({ back: d ? d.name : 'Zurück', right: `<button class="bar-btn" data-a="ex-edit" data-id="${id}">Bearbeiten</button>` })}
      ${hero}
      <h1 class="ex-name">${esc(ex.name)}</h1>
      <div class="tags">${tags}</div>
      ${planLine(ex, day)}
      ${strengthLine(ex, day)}
      <div id="goalbox">${goalHtml(ex)}</div>
      <div id="sets">${setsBlock(ex, day)}</div>
      ${fold('note:' + id, 'Notiz', `<textarea class="field note-field" data-field="note-ex" data-id="${id}" placeholder="z. B. Sitzhöhe 4, enger Griff">${esc(ex.note)}</textarea>`, !!(ex.note || '').trim())}
      ${ex.desc ? fold('desc:' + id, 'Beschreibung', `<div class="fold-text">${esc(ex.desc)}</div>`) : ''}
      ${l ? fold('info:' + id, 'Infos zur Übung', infoHtml(l, ex.name)) : ''}
      ${(() => { const sr = strengthSeries(ex); return sr.length >= 2 ? fold('kraft:' + id, 'Kraftverlauf', `<p class="hint" style="margin:0 0 4px">${metricUnit(ex) === 'kg' ? 'Geschätztes Maximalgewicht je Einheit' : 'Wdh mit Körpergewicht, die deine beste Leistung je Einheit entspricht'}.</p>${chartSvg(sr.map(p => Math.round(p.v * 10) / 10), sr.map(p => p.date))}`) : ''; })()}
      ${recordsHtml(ex) ? fold('rec:' + id, 'Rekorde', `<div id="recbox">${recordsHtml(ex)}</div>`) : ''}
      ${hist.length ? fold('hist:' + id, `Verlauf (${hist.length} ${hist.length === 1 ? 'Einheit' : 'Einheiten'})`, grid) : ''}
      ${next ? `<button class="next" data-a="ex-next" data-id="${nextId}"><span><small>Nächste Übung</small><strong>${esc(next.name)}</strong></span>${ICON.chev.replace('i chev', 'i')}</button>` : ''}`;
  },

  session({ id }) {
    const x = S.sessions.find(y => y.id === id); if (!x) return null;
    const d = S.days[x.dayId];
    const n = sessionSets(x), v = sessionVolume(x);
    const live = x.end == null;
    const order = d ? [...d.exercises.filter(e => x.entries[e]), ...Object.keys(x.entries).filter(e => !d.exercises.includes(e))] : Object.keys(x.entries);
    const items = order.map(exId => {
      const ex = S.exercises[exId], sets = doneSets(x.entries[exId]); if (!sets.length) return '';
      const type = ex ? ex.type : 'weight';
      const pr = (x.prog || []).find(p => p.exId === exId);
      const rec = ex && x.end != null ? sessionPR(ex, x) : null;
      return `<div class="srow"><div class="srow-name">${esc(ex ? ex.name : 'Gelöschte Übung')}${pr ? '<span class="up">↑ Fortschritt</span>' : ''}</div><div class="srow-sets">${sets.map((r, i) => `<span><em>${i + 1}</em>${setHtml(r, type)}${rec && rec.idx === i ? `<b class="pr-tag" data-a="pr-info" data-label="${esc(rec.label)}">PR</b>` : ''}</span>`).join('')}</div></div>`;
    }).join('');
    const other = activeSession();
    const photos = (x.photos || []).length ? `<div class="gallery">${x.photos.map((pid, i) => `<button class="gal-item" data-a="photo-menu" data-sess="${x.id}" data-id="${esc(pid)}" aria-label="Foto ${i + 1}"><img data-img="${esc(pid)}" alt=""></button>`).join('')}</div>${x.photos.length > 1 ? `<p class="gal-hint">${x.photos.length} Fotos, zum Blättern wischen</p>` : ''}` : '';
    return `${bar({ back: d ? d.name : 'Zurück', right: `<button class="bar-btn" data-a="photo-add" data-sess="${x.id}" aria-label="Foto hinzufügen">${ICON.cam}</button>` })}
      ${photos}
      <h1 class="title">${esc(d ? d.name : 'Einheit')}</h1>
      <p class="lead">${esc(new Date(x.start).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }))}${x.legacy ? '' : `, ${fmtTime(x.start)}${live ? ' bis jetzt' : ' bis ' + fmtTime(x.end)}`}</p>
      <div class="stats"><div><b>${x.legacy ? '–' : Math.max(1, Math.round(((x.end || Date.now()) - x.start) / 60000))}</b><span>Minuten</span></div><div><b>${n}</b><span>Sätze</span></div><div><b>${v ? v.toLocaleString('de-DE') : '–'}</b><span>kg bewegt</span></div></div>
      ${items || '<p class="muted">Keine abgehakten Sätze.</p>'}
      ${live ? '' : (!other ? `<button class="btn" style="margin-top:26px" data-a="session-reopen" data-id="${id}">Einheit wieder öffnen</button>` : '')}
      ${live ? '' : `<button class="btn btn-danger" style="margin-top:${other ? 26 : 12}px" data-a="session-delete" data-id="${id}">Einheit löschen</button>`}`;
  },

  edit() {
    const d = ui.draft; if (!d) return null;
    const isNew = !d.id || !S.exercises[d.id];
    const l = d.lib ? LIB[d.lib] : null;
    const preview = d.image ? `<img data-img="${esc(d.image)}" alt="">` : (l && l.img ? netImg(l.img + '/0.jpg') : '');
    return `${bar({ back: 'Abbrechen', title: isNew ? 'Neue Übung' : 'Übung bearbeiten', right: `<button class="bar-btn" data-a="edit-save">Sichern</button>` })}
      <button class="img-pick ${preview ? 'has' : ''}" data-a="pick-img">${preview || `${ICON.img}<span>Bild hinzufügen</span><small>Optional, gern ein Meme</small>`}</button>
      ${d.image ? `<div class="btn-pair"><button class="btn" data-a="pick-img">Bild ändern</button><button class="btn btn-danger" data-a="img-remove">Bild entfernen</button></div>`
        : (l && l.img ? '<button class="btn" data-a="pick-img">Eigenes Bild wählen</button>' : '')}
      <label class="label" for="f-name">Name</label>
      <input class="field" id="f-name" data-field="name" value="${esc(d.name)}" placeholder="z. B. Bankdrücken" autocomplete="off">
      ${l ? `<p class="muted" style="margin-top:8px">Vorlage aus der Bibliothek: ${esc(l.name)}. <button style="font-weight:600;color:var(--chalk)" data-a="lib-open-detail" data-id="${l.id}">Infos ansehen</button></p>` : ''}
      <span class="label">Hauptmuskel</span>
      <div class="chips">${S.muscles.map(m => `<button class="chip ${d.prim.includes(m) ? 'on' : ''}" data-a="prim-toggle" data-v="${esc(m)}">${esc(m)}</button>`).join('')}<button class="chip chip-add" data-a="muscle-new">+ Eigene</button></div>
      <span class="label">Unterstützende Muskeln <span class="opt">optional</span></span>
      <div class="chips">${S.muscles.filter(m => !d.prim.includes(m)).map(m => `<button class="chip ${d.sec.includes(m) ? 'on' : ''}" data-a="sec-toggle" data-v="${esc(m)}">${esc(m)}</button>`).join('')}</div>
      <span class="label">Belastung</span>
      <div class="seg"><button class="${d.type === 'weight' ? 'on' : ''}" data-a="type-pick" data-v="weight">Gewicht</button><button class="${d.type === 'bw' ? 'on' : ''}" data-a="type-pick" data-v="bw">Körpergewicht + Zusatzgewicht</button></div>
      <label class="label" for="f-desc">Beschreibung <span class="opt">optional</span></label>
      <textarea class="field" id="f-desc" data-field="desc" rows="4" placeholder="Ausführung, Einstellungen, worauf du achten willst">${esc(d.desc)}</textarea>
      <button class="btn btn-primary" style="margin-top:26px" data-a="edit-save">${isNew ? 'Übung erstellen' : 'Änderungen sichern'}</button>
      ${isNew ? '' : '<button class="btn btn-danger" data-a="edit-delete">Übung löschen</button>'}`;
  },

  library() {
    const n = Object.keys(S.exercises).length;
    const tab = ui.libTab || (n ? 'mine' : 'lib');
    return `${bar({ back: 'Training', right: `<button class="bar-btn" data-a="lib-new" aria-label="Eigene Übung erstellen">${ICON.plus}</button>` })}
      <h1 class="title">Übungen</h1>
      <div class="seg tabs"><button class="${tab === 'mine' ? 'on' : ''}" data-a="lib-tab" data-v="mine">Meine (${n})</button><button class="${tab === 'lib' ? 'on' : ''}" data-a="lib-tab" data-v="lib">Bibliothek (${LIBRARY.length})</button></div>
      <input class="field" data-field="q" value="${esc(ui.q)}" placeholder="${tab === 'lib' ? 'Übung, Muskel oder Gerät suchen' : 'Deine Übungen durchsuchen'}" autocomplete="off">
      ${tab === 'lib' ? `<div class="chips-scroll">${chipsRow('lib-area', ui.la)}</div>` : ''}
      <div id="lib-list">${tab === 'lib' ? libBrowse() : libList()}</div>
      <button class="btn btn-line" data-a="lib-new">${ICON.plus}Eigene Übung erstellen</button>`;
  },

  libdetail({ id, day }) {
    const l = LIB[id]; if (!l) return null;
    const mine = mineFor(id);
    const d = day && S.days[day];
    const imgs = l.img ? `<div class="lib-imgs"><figure>${netImg(l.img + '/0.jpg')}<figcaption>Start</figcaption></figure><figure>${netImg(l.img + '/1.jpg')}<figcaption>Ende</figcaption></figure></div>` : '';
    return `${bar({ back: d ? d.name : 'Übungen' })}
      ${imgs}
      <h1 class="ex-name">${esc(l.name)}</h1>
      <p class="sub-en">${esc(l.en)}</p>
      ${infoHtml(l)}
      ${mine ? `<p class="mine-note"><span class="done-dot"></span>In deinen Übungen als „${esc(mine.name)}“</p>` : ''}
      ${d ? `<button class="btn btn-primary" style="margin-top:22px" data-a="lib-add-day" data-id="${id}" data-day="${day}">${ICON.plus}Zu ${esc(d.name)} hinzufügen</button>`
          : `<button class="btn btn-primary" style="margin-top:22px" data-a="lib-add" data-id="${id}">${ICON.plus}Zu einem Tag hinzufügen</button>`}
      ${mine ? `<button class="btn" data-a="lib-open" data-id="${mine.id}">Meine Version bearbeiten</button>` : ''}`;
  },

  stats(params = {}) {
    const tab = params.tab || ui.statsTab || 'training';
    const tabs = `<div class="seg seg3 tabs"><button class="${tab === 'training' ? 'on' : ''}" data-a="stats-tab" data-v="training">Training</button><button class="${tab === 'strength' ? 'on' : ''}" data-a="stats-tab" data-v="strength">Stärke</button><button class="${tab === 'plan' ? 'on' : ''}" data-a="stats-tab" data-v="plan">Plan</button></div>`;
    if (tab === 'plan') return `${bar({ back: 'Zurück' })}<h1 class="title">Auswertung</h1>${tabs}${planAnalysisHtml(params.plan)}`;
    if (tab === 'strength') return `${bar({ back: 'Zurück' })}<h1 class="title">Auswertung</h1>${tabs}${strengthHtml()}`;
    const per = ui.per, r = muscleStats(per, ui.half);
    const entries = Object.entries(r.m).sort((a, b) => b[1] - a[1]);
    const max = Math.max(per === 'week' ? 24 : 1, ...entries.map(e => e[1]));
    const ticks = per === 'week' ? [10, 20].map(t => `<span class="tick" style="left:${t / max * 100}%"></span>`).join('') : '';
    const zero = MUSCLES.filter(m => !r.m[m]);
    const label = { week: 'diese Woche', month: 'in den letzten 4 Wochen', all: 'insgesamt' }[per];
    const weeks = [...new Set(S.sessions.filter(x => x.end != null).map(x => weekStartKey(new Date(x.date + 'T12:00:00'))))].sort().reverse();
    return `${bar({ back: 'Zurück' })}
      <h1 class="title">Auswertung</h1>${tabs}
      <p class="lead">Abgehakte Arbeitssätze pro Muskelgruppe. Drops zählen nicht extra.</p>
      <div class="seg seg3"><button class="${per === 'week' ? 'on' : ''}" data-a="per" data-v="week">Woche</button><button class="${per === 'month' ? 'on' : ''}" data-a="per" data-v="month">4 Wochen</button><button class="${per === 'all' ? 'on' : ''}" data-a="per" data-v="all">Gesamt</button></div>
      <div class="stats stats2"><div><b>${r.sets}</b><span>Sätze ${label}</span></div><div><b>${r.trainings}</b><span>Einheiten</span></div></div>
      <button class="switch-row" data-a="half-toggle" role="switch" aria-checked="${ui.half}"><span>Unterstützende Muskeln als halben Satz zählen</span><span class="switch ${ui.half ? 'on' : ''}"></span></button>

    const max = Math.max(g.hi * 1.25, g.direct, 1);
    const zone = `<span class="zone" style="left:${g.lo / max * 100}%;width:${(g.hi - g.lo) / max * 100}%"></span>`;
    const reps = g.reps.length ? `${Math.min(...g.reps.map(r => r[0]))}–${Math.max(...g.reps.map(r => r[1]))} Wdh` : '';
    return `<div class="ana-row ${rt.k}"><div class="bar-head"><span>${esc(g.g)}</span><b>${fmt(g.direct)}</b></div>
      <div class="track ana-track">${zone}<div class="fill" style="width:${Math.min(100, g.direct / max * 100)}%"></div></div>
      <div class="ana-sub"><span class="badge">${rt.t}</span><span>Richtwert ${g.lo ? `${g.lo} bis ${g.hi}` : `bis ${g.hi}`}${g.indirect ? `, dazu ${fmt(g.indirect)} indirekt` : ''}${reps ? `, ${reps}` : ''}${act[g.g] != null ? `, diese Woche ${act[g.g]}` : ''}</span></div>
      ${g.note && rt.k !== 'good' ? `<p class="ana-note">${esc(g.note)}</p>` : ''}</div>`;
  }).join('');
  const other = Object.entries(an.other);
  const low = an.groups.filter(g => rateGroup(g, g.direct).k === 'low').map(g => g.g);
  const high = an.groups.filter(g => rateGroup(g, g.direct).k === 'high').map(g => g.g);
  return `${chips}
    <p class="lead">Geplante direkte Sätze pro Woche aus „${esc(p.name)}“, jeder Tag einmal pro Woche. Die helle Fläche im Balken ist der Richtwert.</p>
    ${low.length || high.length ? `<div class="note">${low.length ? `<b>Mehr Fokus: ${esc(low.join(', '))}</b>` : ''}${high.length ? `<span>Sehr viel: ${esc(high.join(', '))}. Achte dort auf Erholung.</span>` : ''}</div>` : '<div class="note"><b>Alle Muskelgruppen liegen im oder über dem Richtwert.</b></div>'}
    ${rows}
    ${other.length ? `<p class="hint">Ohne Richtwert: ${esc(other.map(([m, v]) => `${m} ${fmt(v)}`).join(', '))}. Unterer Rücken, Unterarme und Adduktoren arbeiten bei Grundübungen stark mit.</p>` : ''}
    ${an.perDay.length ? `<p class="hint"><b>Viel an einem Tag:</b> ${esc(an.perDay.map(x => `${x.day}: ${x.m} ${fmt(x.v)}`).join(', '))}. Laut Studien bringen mehr als etwa 11 Sätze pro Muskel in einer Einheit kaum noch zusätzlich. Verteil sie lieber auf zwei Tage.</p>` : ''}
    ${an.missing.length ? `<p class="hint">Für ${an.missing.length} ${an.missing.length === 1 ? 'Übung' : 'Übungen'} fehlt die Satzangabe, die App schätzt sie aus deiner letzten Einheit oder mit 3 Sätzen: ${esc(an.missing.map(id => S.exercises[id].name).join(', '))}. Trag sie in der Übung unter „Sätze und Wdh-Bereich festlegen“ ein.</p>` : ''}
    <p class="hint">Richtwerte: Volume Landmarks von Renaissance Periodization für fortgeschrittene Hobbysportler. Das sind Erfahrungswerte aus dem Coaching, keine exakten Studienwerte. Gezählt werden nur direkte Sätze, die indirekte Arbeit ist in den Werten schon eingerechnet. Für Muskelaufbau wirken 5 bis 30 Wdh pro Satz ähnlich, solange du nah ans Muskelversagen gehst.</p>`;
}
function goalHtml(ex) {
  if (!ex.goal) return `<button class="goal-add" data-a="goal-open">${ICON.flag}Ziel setzen</button>`;
  const e = goalEval(ex), g = ex.goal;
  let action = '';
  if (e.ready) {
    if (g.weight != null && g.step) action = `<button class="btn btn-primary" data-a="goal-step">Nächstes Ziel: ${esc(wUnit(Math.round((g.weight + g.step) * 100) / 100, ex.type))}</button>`;
    else action = '<div class="goal-sub">Ziel erreicht. Setz dir ein neues.</div>';
  }
  return `<div class="goal ${e.ready ? 'ready' : ''}">
    <div class="goal-top"><span>${e.ready ? 'Ziel erreicht' : 'Ziel'}</span><button class="goal-edit" data-a="goal-open">Ändern</button></div>
    <div class="goal-val">${esc(goalText(g, ex.type))}</div>
    <div class="track"><div class="fill" style="width:${Math.round(e.pct * 100)}%"></div></div>
    <div class="goal-sub">${e.basis ? esc(e.sub) : 'Noch kein Training mit dieser Übung.'}</div>

}

  const lp = lastPerformance(ex.id, dayId);
  const lastLine = lp ? `<p class="last-unit">Letzte Einheit ${esc(rel(lp.date))}</p>` : '';

      <p class="idle-note">Zum Eintragen starte die Einheit bei ${esc(dn)}.</p>`;

    </div>

}

function setRow(s, i, ex, last, pr, ghost) {
  const bw = ex.type === 'bw';
  const gw = s.w == null && ghost && ghost.w != null ? ghost.w : null, gr = s.r == null && ghost && ghost.r != null ? ghost.r : null;
  const drops = (s.drops || []).map((d, j) => `<div class="drop-row"><span class="drop-mark">↳</span>
      <input class="inp" inputmode="decimal" enterkeyhint="done" data-in="dw" data-i="${i}" data-j="${j}" value="${bw && d.w ? '+' + fmt(d.w) : fmt(d.w)}" placeholder="${bw ? 'BW' : 'kg'}" aria-label="Drop ${j + 1} Gewicht">
      <input class="inp" inputmode="numeric" enterkeyhint="done" data-in="dr" data-i="${i}" data-j="${j}" value="${d.r ?? ''}" placeholder="Wdh" aria-label="Drop ${j + 1} Wiederholungen">
      <button class="icon-btn" data-a="drop-del" data-i="${i}" data-j="${j}" aria-label="Drop entfernen">${ICON.x}</button><span></span></div>`).join('');
  const lastTxt = last ? `Last ${setHtml(last, ex.type)}` : 'Last –';
  return `<div class="set ${s.done ? 'done' : ''} ${ui.act === i ? 'act' : ''} ${gr != null && !s.done ? 'has-ghost' : ''}" data-set="${i}"><div class="set-row">
      <button class="set-no" data-a="set-menu" data-i="${i}" aria-label="Satz ${i + 1} Optionen">${i + 1}</button>
      <input class="inp ${gw != null ? 'ghost' : ''}" inputmode="decimal" enterkeyhint="done" data-in="w" data-i="${i}" value="${bw && s.w ? '+' + fmt(s.w) : fmt(s.w)}" placeholder="${gw != null ? ghostW(gw, bw) : (bw ? 'BW' : '–')}" aria-label="Satz ${i + 1} ${bw ? 'Zusatzgewicht' : 'Gewicht'}">
      <input class="inp ${gr != null ? 'ghost' : ''}" inputmode="numeric" enterkeyhint="done" data-in="r" data-i="${i}" value="${s.r ?? ''}" placeholder="${gr != null ? gr : '–'}" aria-label="Satz ${i + 1} Wiederholungen">
      <button class="drop-btn" data-a="drop-add" data-i="${i}">Drop</button>
      <button class="check" data-a="set-check" data-i="${i}" aria-label="Satz ${i + 1} erledigt">${ICON.check}</button>
      ${pr ? `<button class="pr" data-a="pr-info" data-label="${esc(pr.label)}" aria-label="Persönlicher Rekord: ${esc(pr.label)}">PR</button>` : ''}
    </div>
    <div class="step-row"><span></span>
      <div class="steps"><button data-a="step" data-k="w" data-d="-1" data-i="${i}" aria-label="Gewicht minus 1 kg">−</button><button data-a="step" data-k="w" data-d="1" data-i="${i}" aria-label="Gewicht plus 1 kg">+</button></div>
      <div class="steps"><button data-a="step" data-k="r" data-d="-1" data-i="${i}" aria-label="Wiederholungen minus 1">−</button><button data-a="step" data-k="r" data-d="1" data-i="${i}" aria-label="Wiederholungen plus 1">+</button></div>
    </div>
    <button class="last-chip ${last ? '' : 'none'}" data-a="last-use" data-i="${i}" ${last ? '' : 'disabled'}>${lastTxt}</button>
    ${drops}</div>`;
}

function libList() {
  const q = norm(ui.q.trim());
  const all = Object.values(S.exercises).filter(x => exMatch(x, q));
  if (!Object.keys(S.exercises).length) return '<p class="muted">Noch keine eigenen Übungen. Übernimm welche aus der Bibliothek oder leg selbst eine an.</p>';
  if (!all.length) return '<p class="muted">Keine Übung passt zu deiner Suche.</p>';
  const order = [...S.muscles];
  all.forEach(x => { if (!order.includes(mainMuscle(x))) order.push(mainMuscle(x)); });
  return order.map(m => {
    const items = all.filter(x => mainMuscle(x) === m).sort((a, b) => a.name.localeCompare(b.name, 'de'));
    if (!items.length) return '';
    return `<div class="group">${esc(m || 'Ohne Muskelgruppe')}</div><div class="rows">${items.map(x => {
      const days = Object.values(S.days).filter(d => d.exercises.includes(x.id)).map(d => d.name);
      return `<button class="row" data-a="lib-open" data-id="${x.id}">${thumb(x)}<div class="row-main"><div class="row-title">${esc(x.name)}</div><div class="row-sub">${days.length ? esc(days.join(', ')) : 'Keinem Tag zugeordnet'}</div></div>${ICON.chev}</button>`;
    }).join('')}</div>`;
  }).join('');
}

function libBrowse() {
  const q = norm(ui.q.trim());
  const list = LIBRARY.filter(l => libMatch(l, q, ui.la));
  if (!list.length) return '<p class="muted">Keine Übung gefunden. Probier einen anderen Begriff oder leg sie selbst an.</p>';
  const row = l => {
    const mine = mineFor(l.id);
    return `<button class="row" data-a="lib-open-detail" data-id="${l.id}">${libThumb(l)}<div class="row-main"><div class="row-title">${esc(l.name)}</div><div class="row-sub">${mine ? '<span class="done-dot"></span>' : ''}${esc(l.p.join(', '))}, ${esc(l.eq)}</div></div>${ICON.chev}</button>`;
  };
  if (ui.la !== 'Alle' || q) return `<div class="rows" style="margin-top:8px">${list.map(row).join('')}</div>`;
  return AREAS.slice(1, -1).map(a => {
    const items = list.filter(l => l.area === a); if (!items.length) return '';
    return `<div class="group">${a}</div><div class="rows">${items.map(row).join('')}</div>`;
  }).join('');
}

function pickList(dayId) {
  const d = S.days[dayId]; if (!d) return '';
  const q = norm(ui.pq.trim());
  const mine = Object.values(S.exercises).filter(x => !d.exercises.includes(x.id) && exMatch(x, q) && (ui.pa === 'Alle' || (ui.pa === 'Körpergewicht' ? x.type === 'bw' : (libOf(x) ? libOf(x).area === ui.pa : false))))
    .sort((a, b) => a.name.localeCompare(b.name, 'de'));
  const lib = LIBRARY.filter(l => !mineFor(l.id) && libMatch(l, q, ui.pa));

  if (mine.length) html += `<div class="group">Deine Übungen</div><div class="rows">${mine.map(x => `<button class="row" data-a="pick-ex" data-day="${dayId}" data-id="${x.id}">${thumb(x)}<div class="row-main"><div class="row-title">${esc(x.name)}</div><div class="row-sub">${esc(mainMuscle(x))}</div></div>${ICON.plus}</button>`).join('')}</div>`;

/* ---------- Sheets und Toast ---------- */
let sheetEl = null;
function openSheet(inner, onClose) {
  closeSheet();
  const w = document.createElement('div');
  w.className = 'sheet-wrap';
  w.innerHTML = `<div class="sheet-bg" data-a="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true">${inner}</div>`;
  w._onClose = onClose;
  w._sy = window.scrollY;
  document.body.appendChild(w);
  sheetEl = w;
  fitSheet();
  document.body.classList.add('noscroll');
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('open')));
  return w;
}
function closeSheet(val) {
  if (!sheetEl) return;
  const w = sheetEl; sheetEl = null;
  w.classList.remove('open');
  setTimeout(() => w.remove(), 230);
  document.body.classList.remove('noscroll');
  if (w._sy != null && Math.abs(window.scrollY - w._sy) > 1) window.scrollTo(0, w._sy);
  if (w._onClose) w._onClose(val);
}
function fitSheet() {
  if (!sheetEl || !window.visualViewport) return;
  sheetEl.style.height = visualViewport.height + 'px';
  sheetEl.style.top = visualViewport.offsetTop + 'px';
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fitSheet); visualViewport.addEventListener('scroll', fitSheet); }

function ask(title, value = '', placeholder = '', ok = 'Sichern', text = '') {
  return new Promise(res => {
    const w = openSheet(`<div class="sheet-title">${esc(title)}</div>${text ? `<p class="sheet-text">${esc(text)}</p>` : ''}
      <input class="field" id="sheet-input" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off" enterkeyhint="done">
      <div class="btn-pair" style="margin-top:4px"><button class="btn" data-a="sheet-close">Abbrechen</button><button class="btn btn-primary" data-a="sheet-ok">${esc(ok)}</button></div>`,
      v => res(typeof v === 'string' && v ? v : null));
    const inp = w.querySelector('#sheet-input');
    inp.focus();
    if (value) inp.select();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); closeSheet(inp.value.trim()); } });
  });
}
function confirmSheet(title, text, ok) {
  return new Promise(res => openSheet(`<div class="sheet-title">${esc(title)}</div>${text ? `<p class="sheet-text">${esc(text)}</p>` : ''}
    <button class="btn btn-danger" data-a="sheet-opt" data-v="yes">${esc(ok)}</button><button class="btn" data-a="sheet-close">Abbrechen</button>`, v => res(v === 'yes')));
}
function actionSheet(title, opts) {
  return new Promise(res => openSheet(`<div class="sheet-title">${esc(title)}</div>${opts.map(o => `<button class="btn ${o.danger ? 'btn-danger' : ''}" data-a="sheet-opt" data-v="${esc(o.v)}">${esc(o.label)}</button>`).join('')}
    <button class="btn" data-a="sheet-close">Abbrechen</button>`, v => res(v || null)));
}
function openPicker(dayId) {
  ui.pq = ''; ui.pa = 'Alle';

    <button class="btn" data-a="pick-new" data-day="${dayId}">${ICON.plus}Eigene Übung erstellen</button>

}
function openDayChooser(libId) {

async function addLibToDay(libId, dayId) {
  const l = LIB[libId], day = S.days[dayId];
  if (!l || !day) return;
  let ex = mineFor(libId);
  if (!ex) {
    const n = await ask('Name in deinem Plan', l.name, l.name, 'Hinzufügen', 'Lass den Namen so oder gib der Übung deinen eigenen. Die Infos aus der Bibliothek bleiben erhalten.');
    if (!n) return;
    ex = { id: uid(), name: n, lib: libId, prim: [...l.p], sec: [...(l.s || [])], type: l.type, desc: '', image: null, note: '', goal: null, step: null };
    S.exercises[ex.id] = ex;
  }
  if (day.exercises.includes(ex.id)) { toast(`${ex.name} ist schon in ${day.name}`); return; }
  day.exercises.push(ex.id);

}
let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2000);

const exCtx = () => { const c = stack[stack.length - 1]; return c.view === 'ex' ? c.params : null; };
function startDraft(id) {
  const ex = id && S.exercises[id];
  ui.draft = ex ? JSON.parse(JSON.stringify(ex)) : { id: null, name: '', lib: null, prim: [], sec: [], type: 'weight', desc: '', image: null, note: '', goal: null, step: null };
}
function addDrop(sets, i) {
  const s = sets[i]; if (!s) return;
  s.drops = s.drops || [];
  const base = s.drops.length ? s.drops[s.drops.length - 1].w : (s.w != null ? s.w : ghostFor(sets, i).w);
  s.drops.push({ w: dropWeight(base), r: null });
}
function download(file) {
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function backupDone() { S.lastBackup = Date.now(); save(); closeSheet(); toast('Backup gesichert'); rerender(); }
function refreshSets() {
  const c = exCtx(); if (!c) return rerender();
  const ex = S.exercises[c.id], box = document.getElementById('sets'); if (!ex || !box) return rerender();
  box.innerHTML = setsBlock(ex, c.day);
  const g = document.getElementById('goalbox'); if (g) g.innerHTML = goalHtml(ex);
  const rb = document.getElementById('recbox'); if (rb) rb.innerHTML = recordsHtml(ex);
}
async function startSession(dayId) {
  const cur = activeSession();
  if (cur && cur.dayId === dayId) return cur;
  if (cur) {
    const od = S.days[cur.dayId];
    const v = await actionSheet(`${od ? od.name : 'Eine Einheit'} läuft noch`, [{ label: 'Abschließen und neue starten', v: 'finish' }, { label: 'Zur laufenden Einheit', v: 'go' }]);
    if (v === 'go') { go('day', { id: cur.dayId }); return null; }
    if (v !== 'finish') return null;
    finalize(cur, false);
  }
  const x = { id: uid(), dayId, date: today(), start: Date.now(), end: null, last: Date.now(), entries: {}, photos: [] };
  S.sessions.push(x); save();
  return x;
}
function finalize(x, countOpen, endAt) {
  for (const k of Object.keys(x.entries)) {
    let rows = x.entries[k] || [];
    if (countOpen) rows.forEach(r => { if (r.r != null) r.done = true; });
    rows = rows.filter(r => r.done);
    if (rows.length) x.entries[k] = rows; else delete x.entries[k];
  }
  x.end = endAt || Date.now();
  if (!Object.keys(x.entries).length) { S.sessions = S.sessions.filter(y => y !== x); return false; }
  return true;
}
async function finishSession(x) {
  if (!x) return;
  const done = sessionSets(x);
  const open = Object.values(x.entries).reduce((a, rows) => a + rows.filter(r => !r.done && r.r != null).length, 0);
  const exN = Object.values(x.entries).filter(r => doneSets(r).length).length;

    (open ? ` ${open} ${open === 1 ? 'Satz ist' : 'Sätze sind'} eingetragen, aber nicht abgehakt.` : '') + (done || open ? '' : ' Leere Einheiten werden nicht gespeichert.');
  const opts = [{ label: open ? 'Abschließen ohne offene Sätze' : 'Abschließen', v: 'finish' }];

    <button class="btn" data-a="sheet-close">Weiter trainieren</button>`, r => res(r || null)));

  if (!x.prog.length && !prs.length) { toast('Einheit gespeichert'); return; }

    <div class="rows">${x.prog.map(p => { const ex = S.exercises[p.exId]; return `<div class="row prog-row"><div class="row-main"><div class="row-title">${esc(ex.name)}</div><div class="row-sub">${esc(setStr(p.to, ex.type))} statt ${esc(setStr(p.from, ex.type))}</div></div><span class="up">↑</span></div>`; }).join('')}</div>` : ''}

}

        <input class="field" id="sheet-input" inputmode="decimal" enterkeyhint="done" value="${fmt(e[k])}" placeholder="${unit === 'kg' ? 'z. B. 80,5' : 'z. B. 38'}" autocomplete="off">
        <div class="btn-pair" style="margin-top:4px"><button class="btn" data-a="sheet-close">Abbrechen</button><button class="btn btn-primary" data-a="sheet-ok">Sichern</button></div>
        ${e[k] != null ? '<button class="btn btn-danger" data-a="sheet-opt" data-v="__del">Wert entfernen</button>' : ''}`, r => res(r ?? null));
      const inp = w.querySelector('#sheet-input'); inp.focus(); inp.select();
      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); closeSheet(inp.value.trim()); } });
    });
    if (v === null) return;
    if (v === '__del') delete e[k];
    else { const n = num(v); if (n == null || n <= 0) { toast('Bitte eine Zahl eingeben'); return; } e[k] = n; }
    if (!BODY_FIELDS.some(f => e[f[0]] != null)) S.body = S.body.filter(x => x !== e);
    save(); rerender();
  },
  'body-del': async el => {
    if (!await confirmSheet('Eintrag löschen?', 'Alle Werte dieses Tages werden entfernt.', 'Eintrag löschen')) return;
    S.body = S.body.filter(x => x.date !== el.dataset.date); ui.bodyDate = null; save(); rerender(); toast('Eintrag gelöscht');
  },
  'per': el => { ui.per = el.dataset.v; rerender(); },
  'half-toggle': () => { ui.half = !ui.half; rerender(); },

  'backup-make': async () => {
    try {
      await flush();
      const images = {};
      for (const k of await Store.keys('images')) { const v = await Store.get('images', k); if (v) images[k] = v; }
      const json = JSON.stringify({ app: 'gym-tracker', schema: SCHEMA, exportedAt: new Date().toISOString(), state: S, images });
      const name = `gym-backup-${today()}.json`;
      ui.backup = new File([json], name, { type: 'application/json' });
      openSheet(`<div class="sheet-title">Backup bereit</div><p class="sheet-text">${esc(name)}, ${fmtBytes(json.length)}. Wähle im nächsten Schritt „In Dateien sichern“ und dann iCloud Drive.</p>
        <button class="btn btn-primary" data-a="backup-share">Backup sichern</button><button class="btn" data-a="sheet-close">Abbrechen</button>`);
    } catch (e) { toast('Backup konnte nicht erstellt werden'); }
  },
  'backup-share': async () => {
    const f = ui.backup; if (!f) return;
    try {
      if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f] });
      else download(f);
      backupDone();
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      download(f); backupDone();
    }
  },
  'import': () => document.getElementById('file-import').click(),
  'wipe': async () => {
    if (!await confirmSheet('Alle Daten löschen?', 'Pläne, Übungen, Bilder und dein kompletter Verlauf werden gelöscht. Das lässt sich nicht rückgängig machen.', 'Alles löschen')) return;
    await Store.clear('images'); imgCache.clear();
    S = emptyState(); await flush();
    stack = [{ view: 'home', params: {}, scroll: 0 }]; render('top'); toast('Alle Daten gelöscht');
  }
};

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el, e); }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.in) { onSetInput(el); return; }
  const f = el.dataset.field; if (!f) return;
  if (f === 'q') {
    ui.q = el.value;
    const l = document.getElementById('lib-list');
    const tab = ui.libTab || (Object.keys(S.exercises).length ? 'mine' : 'lib');
    if (l) { l.innerHTML = tab === 'lib' ? libBrowse() : libList(); hydrateImages(l); }
  }
  else if (f === 'pq') { ui.pq = el.value; refreshPicker(); }
  else if (f === 'note-ex') { const ex = S.exercises[el.dataset.id]; if (ex) { ex.note = el.value; save(); } }
  else if (f === 'note-day') { const d = S.days[el.dataset.id]; if (d) { d.note = el.value; save(); } }
  else if (ui.draft && f === 'step') { const v = num(el.value); ui.draft.step = v && v > 0 ? v : null; }
  else if (ui.draft && (f === 'name' || f === 'desc')) ui.draft[f] = el.value;
});

function onSetInput(el) {
  const c = exCtx(); if (!c) return;
  const sets = ensureEntry(c.id, c.day); if (!sets) return;
  const s = sets[+el.dataset.i]; if (!s) return;
  const k = el.dataset.in;
  let v = num(el.value);
  if ((k === 'r' || k === 'dr') && v != null) v = Math.max(0, Math.round(v));
  if (k === 'w') s.w = v;
  else if (k === 'r') s.r = v;
  else { const d = (s.drops || [])[+el.dataset.j]; if (!d) return; if (k === 'dw') d.w = v; else d.r = v; }
  if (k === 'w' || k === 'r') updateGhosts();
  save();
}
// Grau vorgemerkte Werte in den folgenden Sätzen live nachziehen, ohne die Seite neu aufzubauen
function updateGhosts() {
  const c = exCtx(); if (!c) return;
  const ex = S.exercises[c.id], rows = currentRows(c.id, c.day), bw = ex.type === 'bw';
  document.querySelectorAll('#sets .set[data-set]').forEach(box => {
    const i = +box.dataset.set, row = rows[i]; if (!row) return;
    const g = ghostFor(rows, i);
    const gw = row.w == null && g.w != null ? g.w : null, gr = row.r == null && g.r != null ? g.r : null;
    const wi = box.querySelector('[data-in="w"]'), ri = box.querySelector('[data-in="r"]');
    if (wi) { wi.placeholder = gw != null ? ghostW(gw, bw) : (bw ? 'BW' : '–'); wi.classList.toggle('ghost', gw != null); }
    if (ri) { ri.placeholder = gr != null ? String(gr) : '–'; ri.classList.toggle('ghost', gr != null); }
    box.classList.toggle('has-ghost', gr != null && !row.done);
  });
}

document.addEventListener('focusin', e => {
  const box = e.target.closest && e.target.closest('.set[data-set]'); if (!box) return;
  const i = +box.dataset.set; if (ui.act === i) return;
  ui.act = i;
  document.querySelectorAll('.set.act').forEach(x => x.classList.remove('act'));
  box.classList.add('act');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('inp')) e.target.blur();
});

document.getElementById('file-img').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f || !ui.draft) return;
  toast('Bild wird geladen');
  try { const id = await putImg(await processImage(f)); ui.draft.image = id; rerender(); }
  catch (err) { toast('Dieses Bild konnte nicht geladen werden'); }
});

document.getElementById('file-photo').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  const x = f && S.sessions.find(y => y.id === ui.photoFor); if (!x) return;
  toast('Foto wird gespeichert');
  try {
    const id = await putImg(await processImage(f));
    if (!Array.isArray(x.photos)) x.photos = [];
    x.photos.push(id); save(); rerender(); toast('Foto gespeichert');
  } catch (err) { toast('Dieses Foto konnte nicht geladen werden'); }
});

document.getElementById('file-import').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (err) { toast('Die Datei ist kein gültiges Backup'); return; }
  if (!data || data.app !== 'gym-tracker' || !data.state) { toast('Die Datei ist kein Backup dieser App'); return; }
  if (!await confirmSheet('Backup wiederherstellen?', `Backup vom ${new Date(data.exportedAt).toLocaleDateString('de-DE')}. Deine aktuellen Daten werden dabei ersetzt.`, 'Wiederherstellen')) return;
  try {
    S = migrate(data.state);
    await Store.clear('images'); imgCache.clear();
    for (const [k, v] of Object.entries(data.images || {})) await Store.put('images', k, v);
    await flush();
    stack = [{ view: 'home', params: {}, scroll: 0 }]; render('top'); toast('Backup wiederhergestellt');
  } catch (err) { toast('Wiederherstellen hat nicht geklappt'); }
});

/* ---------- Zurück wischen vom linken Rand ----------
   Web-Apps auf dem Home-Bildschirm haben keine eingebaute Zurück-Geste, darum hier nachgebaut.
   Die aktuelle Seite folgt dem Finger, darunter liegt schon die vorherige. */
const EDGE = 24;
let sw = null;
function buildUnder(prev) {
  const under = document.createElement('div');
  under.id = 'under';
  const html = (() => { try { return Views[prev.view](prev.params); } catch (e) { return ''; } })() || '';
  under.innerHTML = `<div class="under-bar app-clone"></div><div class="under-body"><div class="app-clone" style="transform:translateY(${-(prev.scroll || 0)}px)">${html}</div></div><div class="under-shade"></div>`;
  const bar = under.querySelector('.under-body .bar');
  if (bar) under.querySelector('.under-bar').appendChild(bar);
  else under.classList.add('no-bar');   // Startseite hat keine Kopfleiste, sonst sitzt die Vorschau 50 px zu tief
  document.body.appendChild(under);
  hydrateImages(under);
  return under;
}
function swipeTo(dx, animate) {
  const W = window.innerWidth, p = Math.min(1, dx / W);
  const tr = animate ? 'transform .22s ease-out' : 'none';
  $app.style.transition = tr; $app.style.transform = `translateX(${dx}px)`;
  if (sw && sw.under) {
    sw.under.style.transition = tr; sw.under.style.transform = `translateX(${-(1 - p) * W * 0.28}px)`;
    const sh = sw.under.querySelector('.under-shade');
    sh.style.transition = animate ? 'opacity .22s ease-out' : 'none'; sh.style.opacity = String(0.55 * (1 - p));
  }
}
function swipeCleanup(keepScroll) {
  const sy = sw && sw.sy;
  if (sw && sw.under) sw.under.remove();
  $app.style.transition = ''; $app.style.transform = '';
  document.body.classList.remove('swiping');
  if (keepScroll && sy != null && Math.abs(window.scrollY - sy) > 1) window.scrollTo(0, sy);
  sw = null;
}
document.addEventListener('touchstart', e => {
  if (sw || sheetEl || stack.length <= 1 || e.touches.length !== 1) return;
  const t = e.touches[0];
  if (t.clientX > EDGE) return;
  sw = { x0: t.clientX, y0: t.clientY, t0: Date.now(), dx: 0, decided: false, under: null };
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!sw || sw.done) return;
  const t = e.touches[0], dx = t.clientX - sw.x0, dy = t.clientY - sw.y0;
  if (!sw.decided) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    if (dx <= 0 || Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
    sw.decided = true;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    sw.sy = window.scrollY;
    document.body.classList.add('swiping');
    sw.under = buildUnder(stack[stack.length - 2]);
  }
  e.preventDefault();
  sw.dx = Math.max(0, dx);
  swipeTo(sw.dx, false);
}, { passive: false });
function swipeEnd() {
  if (!sw) return;
  if (!sw.decided) { sw = null; return; }
  if (sw.done) return;
  const W = window.innerWidth, v = sw.dx / Math.max(1, Date.now() - sw.t0);
  sw.done = true;
  if (sw.dx > W * 0.33 || (v > 0.5 && sw.dx > 40)) {
    swipeTo(W, true);
    setTimeout(() => { swipeCleanup(); back(); }, 230);
  } else {
    swipeTo(0, true);
    setTimeout(() => swipeCleanup(true), 230);
  }
}
document.addEventListener('touchend', swipeEnd);
document.addEventListener('touchcancel', swipeEnd);

/* ---------- Start ---------- */
(async function init() {
  await Store.open();
  let raw = null;
  try { raw = await Store.get('kv', 'state'); } catch (e) {}
  const wasV1 = raw && (raw.version || 1) < SCHEMA;
  S = migrate(raw);
  if (wasV1) flush();
  autoClose();
  stack = [{ view: 'home', params: {}, scroll: 0 }];
  render('top');
  gcImages();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  setInterval(tickTimers, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { autoClose(); tickTimers(); } });
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    // Gab es schon eine aktive Version? Dann lädt die App nach einem Update einmal selbst neu.
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded) return;
      reloaded = true;
      if (activeSession()) { toast('Neue Version bereit, sie startet beim nächsten Öffnen'); return; }
      flush().then(() => location.reload());
    });
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();

</script>
