}
document.addEventListener('toggle', e => { const el = e.target; if (el && el.dataset && el.dataset.fold) ui.folds[el.dataset.fold] = el.open; }, true);
function infoHtml(l, ownName) {
  return `<div class="info">${ownName && ownName !== l.name ? `<p class="orig">Original: ${esc(l.name)}</p>` : ''}
    <dl><dt>Hauptsächlich</dt><dd>${esc(l.p.join(', '))}</dd>${l.s && l.s.length ? `<dt>Unterstützend</dt><dd>${esc(l.s.join(', '))}</dd>` : ''}<dt>Ausrüstung</dt><dd>${esc(l.eq)}</dd></dl>
    <h3>Wofür sie gut ist</h3><p>${esc(l.why)}</p>
    <h3>Ausführung</h3><p>${esc(l.how)}</p>
    <h3>Häufige Fehler</h3><p>${esc(l.err)}</p></div>`;
}
function hasAll(text, q) {
  if (!q) return true;
  const t = norm(text), words = t.split(/[^a-z0-9]+/);
  // kurze Begriffe nur am Wortanfang („lat“ findet Latissimus, nicht Klatschen), längere auch mitten im Wort
  const flat = t.replace(/[^a-z0-9]/g, '');

}

      <h1 class="ex-name">${esc(l.name)}</h1>
      <p class="sub-en">${esc(l.en)}</p>
      ${infoHtml(l)}
      ${mine ? `<p class="mine-note"><span class="done-dot"></span>In deinen Übungen als „${esc(mine.name)}“</p>` : ''}
      ${d ? `<button class="btn btn-primary" style="margin-top:22px" data-a="lib-add-day" data-id="${id}" data-day="${day}">${ICON.plus}Zu ${esc(d.name)} hinzufügen</button>`
          : `<button class="btn btn-primary" style="margin-top:22px" data-a="lib-add" data-id="${id}">${ICON.plus}Zu einem Tag hinzufügen</button>`}
      ${mine ? `<button class="btn" data-a="lib-open" data-id="${mine.id}">Meine Version bearbeiten</button>` : ''}`;
  },

  stats() {
    const per = ui.per, r = muscleStats(per, ui.half);
    const entries = Object.entries(r.m).sort((a, b) => b[1] - a[1]);
    const max = Math.max(per === 'week' ? 24 : 1, ...entries.map(e => e[1]));
    const ticks = per === 'week' ? [10, 20].map(t => `<span class="tick" style="left:${t / max * 100}%"></span>`).join('') : '';
    const zero = MUSCLES.filter(m => !r.m[m]);
    const label = { week: 'diese Woche', month: 'in den letzten 4 Wochen', all: 'insgesamt' }[per];
    return `${bar({ back: 'Training' })}
      <h1 class="title">Auswertung</h1><p class="lead">Abgehakte Arbeitssätze pro Muskelgruppe. Drops zählen nicht extra.</p>
      <div class="seg seg3"><button class="${per === 'week' ? 'on' : ''}" data-a="per" data-v="week">Woche</button><button class="${per === 'month' ? 'on' : ''}" data-a="per" data-v="month">4 Wochen</button><button class="${per === 'all' ? 'on' : ''}" data-a="per" data-v="all">Gesamt</button></div>
      <div class="stats stats2"><div><b>${r.sets}</b><span>Sätze ${label}</span></div><div><b>${r.trainings}</b><span>Trainings</span></div></div>
      <button class="switch-row" data-a="half-toggle" role="switch" aria-checked="${ui.half}"><span>Unterstützende Muskeln als halben Satz zählen</span><span class="switch ${ui.half ? 'on' : ''}"></span></button>
      ${entries.length ? entries.map(([m, v]) => `<div class="bar-row"><div class="bar-head"><span>${esc(m)}</span><b>${fmt(v)}</b></div><div class="track">${ticks}<div class="fill" style="width:${Math.min(100, v / max * 100)}%"></div></div></div>`).join('')
        : `<p class="muted">${label === 'insgesamt' ? 'Noch' : label.replace(/^./, c => c.toUpperCase()) + ' noch'} keine Sätze abgehakt.</p>`}
      ${per === 'week' && entries.length ? '<p class="hint">Grobe Orientierung für Muskelaufbau: etwa 10 bis 20 Sätze pro Muskel und Woche. Die Lücken im Balken markieren 10 und 20.</p>' : ''}
      ${entries.length && zero.length ? `<p class="hint">Nicht trainiert: ${esc(zero.join(', '))}</p>` : ''}`;
  },

  data() {
    const trainings = S.sessions.filter(s => Object.values(s.entries).some(x => doneSets(x).length)).length;
    return `${bar({ back: 'Training' })}
      <h1 class="title">Backup und Daten</h1>
      <p class="lead">Alles liegt nur auf diesem iPhone, in dieser App.</p>
      <div class="note"><b>${esc(backupHint())}</b>Sichere regelmäßig ein Backup in iCloud Drive. Löschst du die App vom Home-Bildschirm oder leert iOS den Speicher, sind die Daten sonst weg.</div>
      <div class="stats"><div><b>${Object.keys(S.exercises).length}</b><span>Übungen</span></div><div><b>${trainings}</b><span>Trainings</span></div><div><b id="storage">–</b><span>Speicher</span></div></div>
      <button class="btn btn-primary" data-a="backup-make">Backup erstellen</button>
      <button class="btn" data-a="import">Backup wiederherstellen</button>
      <button class="btn btn-danger" style="margin-top:36px" data-a="wipe">Alle Daten löschen</button>
      <p class="hint" style="margin-top:28px">Bilder und Grundinfos der Bibliothek stammen aus der freien Übungsdatenbank free-exercise-db. Die Texte wurden für diese App auf Deutsch geschrieben.</p>`;
  }
};

function goalHtml(ex) {
  if (!ex.goal) return `<button class="goal-add" data-a="goal-open">${ICON.flag}Ziel setzen</button>`;
  const e = goalEval(ex), g = ex.goal;
  let action = '';
  if (e.ready) {
    if (g.weight != null && g.step) action = `<button class="btn btn-primary" data-a="goal-step">Nächstes Ziel: ${esc(wLabel(Math.round((g.weight + g.step) * 100) / 100, ex.type))} kg</button>`;
    else action = '<div class="goal-sub">Ziel erreicht. Setz dir ein neues.</div>';
  }
  return `<div class="goal ${e.ready ? 'ready' : ''}">
    <div class="goal-top"><span>${e.ready ? 'Ziel erreicht' : 'Ziel'}</span><button class="goal-edit" data-a="goal-open">Ändern</button></div>
    <div class="goal-val">${esc(goalText(g, ex.type))}</div>
    <div class="track"><div class="fill" style="width:${Math.round(e.pct * 100)}%"></div></div>
    <div class="goal-sub">${e.basis ? esc(e.sub) : 'Noch kein Training mit dieser Übung.'}</div>
    ${action}</div>`;
}

function setRow(s, i, ex) {
  const bw = ex.type === 'bw';
  const drops = (s.drops || []).map((d, j) => `<div class="drop-row"><span class="drop-mark">↳</span>
      <input class="inp" inputmode="decimal" enterkeyhint="done" data-in="dw" data-i="${i}" data-j="${j}" value="${fmt(d.w)}" placeholder="${bw ? '0' : 'kg'}" aria-label="Drop ${j + 1} Gewicht">
      <input class="inp" inputmode="numeric" enterkeyhint="done" data-in="dr" data-i="${i}" data-j="${j}" value="${d.r ?? ''}" placeholder="Wdh" aria-label="Drop ${j + 1} Wiederholungen">
      <button class="icon-btn" data-a="drop-del" data-i="${i}" data-j="${j}" aria-label="Drop entfernen">${ICON.x}</button><span></span></div>`).join('');
  return `<div class="set ${s.done ? 'done' : ''}"><div class="set-row">
      <button class="set-no" data-a="set-menu" data-i="${i}" aria-label="Satz ${i + 1} Optionen">${i + 1}</button>
      <input class="inp" inputmode="decimal" enterkeyhint="done" data-in="w" data-i="${i}" value="${fmt(s.w)}" placeholder="${bw ? '0' : '–'}" aria-label="Satz ${i + 1} ${bw ? 'Zusatzgewicht' : 'Gewicht'}">
      <input class="inp" inputmode="numeric" enterkeyhint="done" data-in="r" data-i="${i}" value="${s.r ?? ''}" placeholder="–" aria-label="Satz ${i + 1} Wiederholungen">
      <button class="drop-btn" data-a="drop-add" data-i="${i}">Drop</button>
      <button class="check" data-a="set-check" data-i="${i}" aria-label="Satz ${i + 1} erledigt">${ICON.check}</button>
    </div>${drops}</div>`;
}

function libList() {
  const q = norm(ui.q.trim());
  const all = Object.values(S.exercises).filter(x => exMatch(x, q));
  if (!Object.keys(S.exercises).length) return '<p class="muted">Noch keine eigenen Übungen. Übernimm welche aus der Bibliothek oder leg selbst eine an.</p>';
  if (!all.length) return '<p class="muted">Keine Übung passt zu deiner Suche.</p>';
  const order = [...S.muscles];
  all.forEach(x => { if (!order.includes(mainMuscle(x))) order.push(mainMuscle(x)); });
  return order.map(m => {
    const items = all.filter(x => mainMuscle(x) === m).sort((a, b) => a.name.localeCompare(b.name, 'de'));
    if (!items.length) return '';
    return `<div class="group">${esc(m || 'Ohne Muskelgruppe')}</div><div class="rows">${items.map(x => {
      const days = Object.values(S.days).filter(d => d.exercises.includes(x.id)).map(d => d.name);
      return `<button class="row" data-a="lib-open" data-id="${x.id}">${thumb(x)}<div class="row-main"><div class="row-title">${esc(x.name)}</div><div class="row-sub">${days.length ? esc(days.join(', ')) : 'Keinem Tag zugeordnet'}</div></div>${ICON.chev}</button>`;
    }).join('')}</div>`;
  }).join('');
}

function libBrowse() {
  const q = norm(ui.q.trim());
  const list = LIBRARY.filter(l => libMatch(l, q, ui.la));
  if (!list.length) return '<p class="muted">Keine Übung gefunden. Probier einen anderen Begriff oder leg sie selbst an.</p>';
  const row = l => {
    const mine = mineFor(l.id);
    return `<button class="row" data-a="lib-open-detail" data-id="${l.id}">${libThumb(l)}<div class="row-main"><div class="row-title">${esc(l.name)}</div><div class="row-sub">${mine ? '<span class="done-dot"></span>' : ''}${esc(l.p.join(', '))}, ${esc(l.eq)}</div></div>${ICON.chev}</button>`;
  };
  if (ui.la !== 'Alle' || q) return `<div class="rows" style="margin-top:8px">${list.map(row).join('')}</div>`;
  return AREAS.slice(1, -1).map(a => {
    const items = list.filter(l => l.area === a); if (!items.length) return '';
    return `<div class="group">${a}</div><div class="rows">${items.map(row).join('')}</div>`;
  }).join('');
}

function pickList(dayId) {
  const d = S.days[dayId]; if (!d) return '';
  const q = norm(ui.pq.trim());
  const mine = Object.values(S.exercises).filter(x => !d.exercises.includes(x.id) && exMatch(x, q) && (ui.pa === 'Alle' || (ui.pa === 'Körpergewicht' ? x.type === 'bw' : (libOf(x) ? libOf(x).area === ui.pa : false))))
    .sort((a, b) => a.name.localeCompare(b.name, 'de'));
  const lib = LIBRARY.filter(l => !mineFor(l.id) && libMatch(l, q, ui.pa));
  let html = '';
  if (mine.length) html += `<div class="group">Deine Übungen</div><div class="rows">${mine.map(x => `<button class="row" data-a="pick-ex" data-day="${dayId}" data-id="${x.id}">${thumb(x)}<div class="row-main"><div class="row-title">${esc(x.name)}</div><div class="row-sub">${esc(mainMuscle(x))}</div></div>${ICON.plus}</button>`).join('')}</div>`;
  if (lib.length) html += `<div class="group">Bibliothek</div>${lib.map(l => `<div class="lib-row"><button class="row" data-a="pick-lib" data-day="${dayId}" data-id="${l.id}">${libThumb(l)}<div class="row-main"><div class="row-title">${esc(l.name)}</div><div class="row-sub">${esc(l.p.join(', '))}, ${esc(l.eq)}</div></div></button><button class="info-btn" data-a="pick-info" data-day="${dayId}" data-id="${l.id}" aria-label="Infos zu ${esc(l.name)}">i</button></div>`).join('')}`;
  return html || '<p class="muted">Nichts gefunden. Leg die Übung oben selbst an.</p>';
}

/* ---------- Sheets und Toast ---------- */
let sheetEl = null;
function openSheet(inner, onClose) {
  closeSheet();
  const w = document.createElement('div');
  w.className = 'sheet-wrap';
  w.innerHTML = `<div class="sheet-bg" data-a="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true">${inner}</div>`;
  w._onClose = onClose;
  document.body.appendChild(w);
  sheetEl = w;
  fitSheet();
  document.body.classList.add('noscroll');
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('open')));
  return w;
}
function closeSheet(val) {
  if (!sheetEl) return;
  const w = sheetEl; sheetEl = null;
  w.classList.remove('open');
  setTimeout(() => w.remove(), 230);
  document.body.classList.remove('noscroll');
  if (w._onClose) w._onClose(val);
}
function fitSheet() {
  if (!sheetEl || !window.visualViewport) return;
  sheetEl.style.height = visualViewport.height + 'px';
  sheetEl.style.top = visualViewport.offsetTop + 'px';
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fitSheet); visualViewport.addEventListener('scroll', fitSheet); }

function ask(title, value = '', placeholder = '', ok = 'Sichern', text = '') {
  return new Promise(res => {
    const w = openSheet(`<div class="sheet-title">${esc(title)}</div>${text ? `<p class="sheet-text">${esc(text)}</p>` : ''}
      <input class="field" id="sheet-input" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off" enterkeyhint="done">
      <div class="btn-pair" style="margin-top:4px"><button class="btn" data-a="sheet-close">Abbrechen</button><button class="btn btn-primary" data-a="sheet-ok">${esc(ok)}</button></div>`,
      v => res(typeof v === 'string' && v ? v : null));
    const inp = w.querySelector('#sheet-input');
    inp.focus();
    if (value) inp.select();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); closeSheet(inp.value.trim()); } });
  });
}
function confirmSheet(title, text, ok) {
  return new Promise(res => openSheet(`<div class="sheet-title">${esc(title)}</div>${text ? `<p class="sheet-text">${esc(text)}</p>` : ''}
    <button class="btn btn-danger" data-a="sheet-opt" data-v="yes">${esc(ok)}</button><button class="btn" data-a="sheet-close">Abbrechen</button>`, v => res(v === 'yes')));
}
function actionSheet(title, opts) {
  return new Promise(res => openSheet(`<div class="sheet-title">${esc(title)}</div>${opts.map(o => `<button class="btn ${o.danger ? 'btn-danger' : ''}" data-a="sheet-opt" data-v="${esc(o.v)}">${esc(o.label)}</button>`).join('')}
    <button class="btn" data-a="sheet-close">Abbrechen</button>`, v => res(v || null)));
}
function openPicker(dayId) {
  ui.pq = ''; ui.pa = 'Alle';
  const w = openSheet(`<div class="sheet-title">Übung hinzufügen</div>
    <button class="btn" data-a="pick-new" data-day="${dayId}">${ICON.plus}Eigene Übung erstellen</button>
    <input class="field" data-field="pq" placeholder="Übung, Muskel oder Gerät suchen" autocomplete="off">
    <div class="chips-scroll" id="pick-chips">${chipsRow('pick-area', ui.pa)}</div>
    <div id="pick-list">${pickList(dayId)}</div>`);
  w.dataset.day = dayId;
  hydrateImages(w);
}
function refreshPicker() {
  if (!sheetEl) return;
  const l = sheetEl.querySelector('#pick-list'), c = sheetEl.querySelector('#pick-chips');
  if (c) c.innerHTML = chipsRow('pick-area', ui.pa);
  if (l) { l.innerHTML = pickList(sheetEl.dataset.day); hydrateImages(l); }
}
function openDayChooser(libId) {
  if (!S.plans.length) { toast('Leg zuerst einen Trainingsplan an'); return; }
  openSheet(`<div class="sheet-title">Zu welchem Tag?</div>${S.plans.map(p => `<div class="group">${esc(p.name)}</div><div class="rows">${p.days.map(dId => {
    const d = S.days[dId]; if (!d) return '';
    return `<button class="row" data-a="lib-add-day" data-id="${libId}" data-day="${dId}"><div class="row-main"><div class="row-title">${esc(d.name)}</div><div class="row-sub">${d.exercises.length} ${d.exercises.length === 1 ? 'Übung' : 'Übungen'}</div></div>${ICON.plus}</button>`;
  }).join('')}</div>`).join('')}<button class="btn" data-a="sheet-close">Abbrechen</button>`);
}
function openGoal(ex) {
  const g = ex.goal || {};
  const wl = ex.type === 'bw' ? 'Zusatzgewicht (kg)' : 'Gewicht (kg)';
  openSheet(`<div class="sheet-title">Ziel für ${esc(ex.name)}</div>
    <p class="sheet-text">Alles ist optional. Trag nur ein, was du verfolgen willst. Mit Steigerung schlägt die App das nächste Gewicht vor, sobald du das Ziel in allen Sätzen schaffst.</p>
    <div class="goal-grid">
      <label>Sätze<input class="field" id="g-sets" inputmode="numeric" value="${g.sets ?? ''}" placeholder="z. B. 3"></label>
      <label>Wiederholungen<input class="field" id="g-reps" inputmode="numeric" value="${g.reps ?? ''}" placeholder="z. B. 12"></label>
      <label>${wl}<input class="field" id="g-w" inputmode="decimal" value="${fmt(g.weight)}" placeholder="z. B. 20"></label>
      <label>Steigerung (kg)<input class="field" id="g-step" inputmode="decimal" value="${fmt(g.step)}" placeholder="z. B. 2,5"></label>
    </div>
    <button class="btn btn-primary" data-a="goal-save">Ziel sichern</button>
    ${ex.goal ? '<button class="btn btn-danger" data-a="goal-del">Ziel entfernen</button>' : ''}
    <button class="btn" data-a="sheet-close">Abbrechen</button>`);
}
async function addLibToDay(libId, dayId) {
  const l = LIB[libId], day = S.days[dayId];
  if (!l || !day) return;
  let ex = mineFor(libId);
  if (!ex) {
    const n = await ask('Name in deinem Plan', l.name, l.name, 'Hinzufügen', 'Lass den Namen so oder gib der Übung deinen eigenen. Die Infos aus der Bibliothek bleiben erhalten.');
    if (!n) return;
    ex = { id: uid(), name: n, lib: libId, prim: [...l.p], sec: [...(l.s || [])], type: l.type, desc: '', image: null, note: '', goal: null };
    S.exercises[ex.id] = ex;
  }
  if (day.exercises.includes(ex.id)) { toast(`${ex.name} ist schon in ${day.name}`); return; }
  day.exercises.push(ex.id);
  save(); rerender();
  toast(`${ex.name} zu ${day.name} hinzugefügt`);
}
let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2000);
}
async function showStorage() {
  const el = document.getElementById('storage');
  try { const e = await navigator.storage.estimate(); if (el) el.textContent = fmtBytes(e.usage || 0); } catch (e) {}
}

/* ---------- Aktionen ---------- */
const exCtx = () => { const c = stack[stack.length - 1]; return c.view === 'ex' ? c.params : null; };
function startDraft(id) {
  const ex = id && S.exercises[id];
  ui.draft = ex ? JSON.parse(JSON.stringify(ex)) : { id: null, name: '', lib: null, prim: [], sec: [], type: 'weight', desc: '', image: null, note: '', goal: null };
}
function addDrop(sets, i) {
  const s = sets[i]; if (!s) return;
  s.drops = s.drops || [];
  const base = s.drops.length ? s.drops[s.drops.length - 1].w : s.w;
  s.drops.push({ w: dropWeight(base), r: null });
}
function download(file) {
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function backupDone() { S.lastBackup = Date.now(); save(); closeSheet(); toast('Backup gesichert'); rerender(); }
const toggleIn = (arr, v) => { const i = arr.indexOf(v); if (i > -1) arr.splice(i, 1); else arr.push(v); };

const A = {
  back: () => back(),
  go: el => go(el.dataset.view),
  'sheet-close': () => closeSheet(null),
  'sheet-ok': () => { const inp = sheetEl && sheetEl.querySelector('#sheet-input'); closeSheet(inp ? inp.value.trim() : 'ok'); },
  'sheet-opt': el => closeSheet(el.dataset.v),
  'edit-toggle': el => { ui.edit = ui.edit === el.dataset.key ? null : el.dataset.key; rerender(); },

  'plan-template': () => { const p = newPlan('Push Pull Legs + Calisthenics', ['Push', 'Pull', 'Legs', 'Calisthenics']); save(); go('plan', { id: p.id }); },
  'plan-new': async () => { const n = await ask('Neuer Plan', '', 'z. B. Mein Split', 'Erstellen'); if (!n) return; const p = newPlan(n, []); save(); go('plan', { id: p.id }); },
  'open-plan': el => go('plan', { id: el.dataset.id }),
  'plan-rename': async el => { const p = findPlan(el.dataset.id); const n = await ask('Plan umbenennen', p.name); if (!n) return; p.name = n; save(); rerender(); },
  'plan-delete': async el => {
    const p = findPlan(el.dataset.id);
    if (!await confirmSheet(`${p.name} löschen?`, 'Die Tage dieses Plans werden gelöscht. Deine Übungen und dein Verlauf bleiben erhalten.', 'Plan löschen')) return;
    p.days.forEach(d => delete S.days[d]); S.plans = S.plans.filter(x => x !== p); save(); back(); toast('Plan gelöscht');
  },
  'day-add': async el => {
    const p = findPlan(el.dataset.plan);
    const n = await ask('Neuer Tag', '', 'z. B. Push', 'Hinzufügen'); if (!n) return;
    const d = { id: uid(), name: n, exercises: [], note: '' }; S.days[d.id] = d; p.days.push(d.id); save(); rerender();
  },
  'day-move': el => { moveIn(findPlan(el.dataset.plan).days, +el.dataset.i, +el.dataset.dir); save(); rerender(); },
  'day-rename': async el => { const d = S.days[el.dataset.id]; const n = await ask('Tag umbenennen', d.name); if (!n) return; d.name = n; save(); rerender(); },
  'day-delete': async el => {
    const d = S.days[el.dataset.id];
    if (!await confirmSheet(`${d.name} löschen?`, 'Deine Übungen und dein Verlauf bleiben erhalten.', 'Tag löschen')) return;
    const p = findPlan(el.dataset.plan); p.days = p.days.filter(x => x !== d.id); delete S.days[d.id]; save(); rerender(); toast('Tag gelöscht');
  },
  'open-day': el => go('day', { id: el.dataset.id }),

  'ex-add': el => openPicker(el.dataset.day),
  'pick-area': el => { ui.pa = el.dataset.v; refreshPicker(); },
  'pick-ex': el => {
    const d = S.days[el.dataset.day];
    if (!d.exercises.includes(el.dataset.id)) d.exercises.push(el.dataset.id);
    save(); closeSheet(); rerender(); toast('Übung hinzugefügt');
  },
  'pick-lib': el => addLibToDay(el.dataset.id, el.dataset.day),
  'pick-info': el => { const { id, day } = el.dataset; closeSheet(); go('libdetail', { id, day }); },
  'pick-new': el => { const day = el.dataset.day; closeSheet(); startDraft(null); go('edit', { day }); },
  'ex-move': el => { moveIn(S.days[el.dataset.day].exercises, +el.dataset.i, +el.dataset.dir); save(); rerender(); },
  'ex-remove': el => { S.days[el.dataset.day].exercises.splice(+el.dataset.i, 1); save(); rerender(); toast('Aus diesem Tag entfernt'); },
  'open-ex': el => go('ex', { id: el.dataset.id, day: el.dataset.day }),
  'ex-next': el => { const c = stack[stack.length - 1]; c.params = { ...c.params, id: el.dataset.id }; render('top'); },
  'ex-edit': el => { startDraft(el.dataset.id); go('edit', { id: el.dataset.id }); },

  'lib-tab': el => { ui.libTab = el.dataset.v; ui.q = ''; rerender(); },
  'lib-area': el => { ui.la = el.dataset.v; rerender(); },
  'lib-new': () => { startDraft(null); go('edit', {}); },
  'lib-open': el => { startDraft(el.dataset.id); go('edit', { id: el.dataset.id }); },
  'lib-open-detail': el => go('libdetail', { id: el.dataset.id }),
  'lib-add': el => openDayChooser(el.dataset.id),
  'lib-add-day': el => { const { id, day } = el.dataset; closeSheet(); addLibToDay(id, day); },

  'goal-open': () => { const c = exCtx(); if (c) openGoal(S.exercises[c.id]); },
  'goal-save': () => {
    const c = exCtx(); if (!c || !sheetEl) return;
    const ex = S.exercises[c.id];
    const v = id => num(sheetEl.querySelector(id).value);
    const int = x => x == null ? null : Math.max(1, Math.round(x));
    const g = { sets: int(v('#g-sets')), reps: int(v('#g-reps')), weight: v('#g-w'), step: v('#g-step') };
    if (g.reps == null && g.weight == null) { toast('Trag mindestens Wiederholungen oder ein Gewicht ein'); return; }
    if (g.step != null && g.step <= 0) g.step = null;
    ex.goal = g; save(); closeSheet(); rerender(); toast('Ziel gesichert');
  },
  'goal-del': () => { const c = exCtx(); if (!c) return; S.exercises[c.id].goal = null; save(); closeSheet(); rerender(); toast('Ziel entfernt'); },
  'goal-step': () => {
    const c = exCtx(); if (!c) return;
    const g = S.exercises[c.id].goal; if (!g || g.weight == null || !g.step) return;
    g.weight = Math.round((g.weight + g.step) * 100) / 100; save(); rerender(); toast('Neues Ziel übernommen');
  },

  'set-check': el => {
    const c = exCtx(); if (!c) return;
    const sets = ensureEntry(c.id, c.day), i = +el.dataset.i, s = sets[i]; if (!s) return;
    if (!s.done && s.r == null) {
      const inp = $app.querySelector(`[data-in="r"][data-i="${i}"]`);
      if (inp) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.focus(); }
      toast('Trag erst die Wiederholungen ein');
      return;
    }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    s.done = !s.done; save(); rerender();
  },
  'set-add': () => {
    const c = exCtx(); if (!c) return;
    const sets = ensureEntry(c.id, c.day), last = sets[sets.length - 1];
    sets.push({ w: last ? last.w : null, r: last ? last.r : null, done: false, drops: [] });
    save(); rerender();
  },
  'set-menu': async el => {
    const c = exCtx(); if (!c) return;
    const i = +el.dataset.i;
    const v = await actionSheet(`Satz ${i + 1}`, [{ label: 'Drop hinzufügen', v: 'drop' }, { label: 'Satz löschen', v: 'del', danger: true }]);
    if (!v) return;
    const sets = ensureEntry(c.id, c.day);
    if (v === 'drop') addDrop(sets, i); else sets.splice(i, 1);
    save(); rerender();
  },
  'drop-add': el => { const c = exCtx(); if (!c) return; addDrop(ensureEntry(c.id, c.day), +el.dataset.i); save(); rerender(); },
  'drop-del': el => {
    const c = exCtx(); if (!c) return;
    const s = ensureEntry(c.id, c.day)[+el.dataset.i]; if (!s) return;
    s.drops.splice(+el.dataset.j, 1); save(); rerender();
  },

  'prim-toggle': el => { const d = ui.draft, m = el.dataset.v; toggleIn(d.prim, m); d.sec = d.sec.filter(x => !d.prim.includes(x)); rerender(); },
  'sec-toggle': el => { toggleIn(ui.draft.sec, el.dataset.v); rerender(); },
  'muscle-new': async () => {
    const n = await ask('Neue Muskelgruppe', '', 'z. B. Nacken', 'Hinzufügen'); if (!n) return;
    if (!S.muscles.includes(n)) { S.muscles.push(n); save(); }
    if (!ui.draft.prim.includes(n)) ui.draft.prim.push(n);
    rerender();
  },
  'type-pick': el => { ui.draft.type = el.dataset.v; rerender(); },
  'pick-img': () => document.getElementById('file-img').click(),
  'img-remove': () => { ui.draft.image = null; rerender(); },
  'edit-save': () => {
    const d = ui.draft; if (!d) return;
    d.name = (d.name || '').trim();
    if (!d.name) { toast('Gib der Übung einen Namen'); document.getElementById('f-name')?.focus(); return; }
    if (!d.prim.length) { toast('Wähle mindestens einen Hauptmuskel'); return; }
    const old = d.id && S.exercises[d.id];
    if (old) {
      if (old.image && old.image !== d.image) delImg(old.image);
      Object.assign(old, { name: d.name, prim: d.prim, sec: d.sec, type: d.type, desc: d.desc, image: d.image });
    } else {
      const id = uid();
      S.exercises[id] = { ...d, id };
      const day = stack[stack.length - 1].params.day;
      if (day && S.days[day]) S.days[day].exercises.push(id);
    }
    ui.draft = null; save(); back(); toast(old ? 'Änderungen gesichert' : 'Übung erstellt');
  },
  'edit-delete': async () => {
    const d = ui.draft, ex = d && S.exercises[d.id]; if (!ex) return;
    if (!await confirmSheet(`${ex.name} löschen?`, 'Die Übung wird aus allen Tagen und aus deinen Übungen entfernt.', 'Übung löschen')) return;
    Object.values(S.days).forEach(day => { day.exercises = day.exercises.filter(x => x !== ex.id); });
    if (ex.image) delImg(ex.image);
    delete S.exercises[ex.id];
    ui.draft = null; save(); back(); toast('Übung gelöscht');
  },

  'per': el => { ui.per = el.dataset.v; rerender(); },
  'half-toggle': () => { ui.half = !ui.half; rerender(); },

  'backup-make': async () => {
    try {
      await flush();
      const images = {};
      for (const k of await Store.keys('images')) { const v = await Store.get('images', k); if (v) images[k] = v; }
      const json = JSON.stringify({ app: 'gym-tracker', schema: SCHEMA, exportedAt: new Date().toISOString(), state: S, images });
      const name = `gym-backup-${today()}.json`;
      ui.backup = new File([json], name, { type: 'application/json' });
      openSheet(`<div class="sheet-title">Backup bereit</div><p class="sheet-text">${esc(name)}, ${fmtBytes(json.length)}. Wähle im nächsten Schritt „In Dateien sichern“ und dann iCloud Drive.</p>
        <button class="btn btn-primary" data-a="backup-share">Backup sichern</button><button class="btn" data-a="sheet-close">Abbrechen</button>`);
    } catch (e) { toast('Backup konnte nicht erstellt werden'); }
  },
  'backup-share': async () => {
    const f = ui.backup; if (!f) return;
    try {
      if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f] });
      else download(f);
      backupDone();
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      download(f); backupDone();
    }
  },
  'import': () => document.getElementById('file-import').click(),
  'wipe': async () => {
    if (!await confirmSheet('Alle Daten löschen?', 'Pläne, Übungen, Bilder und dein kompletter Verlauf werden gelöscht. Das lässt sich nicht rückgängig machen.', 'Alles löschen')) return;
    await Store.clear('images'); imgCache.clear();
    S = emptyState(); await flush();
    stack = [{ view: 'home', params: {}, scroll: 0 }]; render('top'); toast('Alle Daten gelöscht');
  }
};

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el, e); }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.in) { onSetInput(el); return; }
  const f = el.dataset.field; if (!f) return;
  if (f === 'q') {
    ui.q = el.value;
    const l = document.getElementById('lib-list');
    const tab = ui.libTab || (Object.keys(S.exercises).length ? 'mine' : 'lib');
    if (l) { l.innerHTML = tab === 'lib' ? libBrowse() : libList(); hydrateImages(l); }
  }
  else if (f === 'pq') { ui.pq = el.value; refreshPicker(); }
  else if (f === 'note-ex') { const ex = S.exercises[el.dataset.id]; if (ex) { ex.note = el.value; save(); } }
  else if (f === 'note-day') { const d = S.days[el.dataset.id]; if (d) { d.note = el.value; save(); } }
  else if (ui.draft && (f === 'name' || f === 'desc')) ui.draft[f] = el.value;
});

function onSetInput(el) {
  const c = exCtx(); if (!c) return;
  const s = ensureEntry(c.id, c.day)[+el.dataset.i]; if (!s) return;
  const k = el.dataset.in;
  let v = num(el.value);
  if ((k === 'r' || k === 'dr') && v != null) v = Math.max(0, Math.round(v));
  if (k === 'w') s.w = v;
  else if (k === 'r') s.r = v;
  else { const d = (s.drops || [])[+el.dataset.j]; if (!d) return; if (k === 'dw') d.w = v; else d.r = v; }
  save();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('inp')) e.target.blur();
});

document.getElementById('file-img').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f || !ui.draft) return;
  toast('Bild wird geladen');
  try { const id = await putImg(await processImage(f)); ui.draft.image = id; rerender(); }
  catch (err) { toast('Dieses Bild konnte nicht geladen werden'); }
});

document.getElementById('file-import').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (err) { toast('Die Datei ist kein gültiges Backup'); return; }
  if (!data || data.app !== 'gym-tracker' || !data.state) { toast('Die Datei ist kein Backup dieser App'); return; }
  if (!await confirmSheet('Backup wiederherstellen?', `Backup vom ${new Date(data.exportedAt).toLocaleDateString('de-DE')}. Deine aktuellen Daten werden dabei ersetzt.`, 'Wiederherstellen')) return;
  try {
    S = migrate(data.state);
    await Store.clear('images'); imgCache.clear();
    for (const [k, v] of Object.entries(data.images || {})) await Store.put('images', k, v);
    await flush();
    stack = [{ view: 'home', params: {}, scroll: 0 }]; render('top'); toast('Backup wiederhergestellt');
  } catch (err) { toast('Wiederherstellen hat nicht geklappt'); }
});

/* ---------- Start ---------- */
(async function init() {
  await Store.open();
  let raw = null;
  try { raw = await Store.get('kv', 'state'); } catch (e) {}
  const wasV1 = raw && (raw.version || 1) < SCHEMA;
  S = migrate(raw);
  const t = today();
  S.sessions = S.sessions.filter(s => s.date === t || Object.values(s.entries).some(x => doneSets(x).length));
  if (wasV1) flush();
  stack = [{ view: 'home', params: {}, scroll: 0 }];
  render('top');
  gcImages();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
</body>
</html>
