<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<title>Gym</title>
<style>
:root{
  --black:#000;
  --iron:#1a1a1a;
  --steel:#2c2c2c;
  --chalk:#fff;
  --ash:#8f8f8f;
  --smoke:#585858;
  --danger:#ff5c55;
  --plate:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--black);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--black);color:var(--chalk);
  font:16px/1.4 var(--ui);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) 0 calc(env(safe-area-inset-bottom,0px) + 40px);
  min-height:100vh;overscroll-behavior-y:none;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--black);z-index:30}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none;text-align:inherit}
input,textarea{font:inherit;color:var(--chalk)}
::selection{background:var(--chalk);color:var(--black)}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:620px;margin:0 auto;padding:0 18px}
.hidden{display:none}

/* Leiste oben */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--black);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:50px;margin:0 -18px;padding:0 6px}
.bar-back{display:flex;align-items:center;gap:0;height:44px;padding:0 10px 0 4px;font-size:17px;justify-self:start;max-width:42vw}
.bar-back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-title{font-size:15px;color:var(--ash);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-right{justify-self:end;display:flex}
.bar-btn{height:44px;padding:0 12px;font-size:17px;font-weight:600;display:flex;align-items:center}

/* Typografie */
.title{font:800 46px/0.95 var(--plate);letter-spacing:-.01em;margin:14px 0 8px;word-break:break-word}
.home-top{padding-top:22px}
.lead{color:var(--ash);font-size:15px;margin:0 0 22px}
.lead b{color:var(--chalk);font-weight:600}
.group{font-size:14px;color:var(--smoke);font-weight:600;margin:30px 0 4px}
.muted{color:var(--ash);font-size:15px;margin:14px 0}

/* Listen mit Haarlinien statt Karten */
.rows{border-top:1px solid var(--steel)}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 0;border-bottom:1px solid var(--steel);text-align:left}
.row:active{opacity:.6}
.row-main{flex:1;min-width:0}
.row-title{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:14px;color:var(--ash);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.chev{color:var(--smoke)}
.done-dot{width:8px;height:8px;border-radius:50%;background:var(--chalk);flex:none}
.warn-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none}

/* Trainingstage als große Schrift */
.day{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;padding:16px 0 14px;border-bottom:1px solid var(--steel);text-align:left}
.day:active .day-name{opacity:.55}
.day-name{font:800 52px/0.92 var(--plate);letter-spacing:-.01em;word-break:break-word;min-width:0}
.day-meta{font-size:14px;color:var(--ash);text-align:right;flex:none;line-height:1.3}
.day.is-today .day-meta{color:var(--chalk)}
.day.is-today .day-meta::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--chalk);margin-right:6px;vertical-align:1px}

/* Bearbeiten-Zeilen */
.erow{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 0;border-bottom:1px solid var(--steel)}
.erow-name{flex:1;min-width:0;font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow-actions{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:var(--iron)}
.icon-btn:disabled{opacity:.25}
.icon-btn.danger{color:var(--danger)}
.icon-btn .i{width:20px;height:20px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;margin-top:12px;padding:0 18px;border-radius:12px;background:var(--iron);font-size:16px;font-weight:600}
.btn:active{opacity:.65}
.btn-primary{background:var(--chalk);color:var(--black)}
.btn-line{background:none;border:1px dashed var(--steel);color:var(--ash)}
.btn-danger{color:var(--danger)}
.btn .i{width:20px;height:20px}
.btn-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Bilder */
.thumb{position:relative;width:54px;height:54px;border-radius:10px;background:var(--iron);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;font:700 19px/1 var(--plate);color:var(--ash)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
img.net{opacity:0;transition:opacity .2s}
img.net.loaded{opacity:1}
img[data-img]{opacity:0;transition:opacity .2s}
img[data-img].loaded{opacity:1}
.hero{margin:0 -18px;background:var(--black);min-height:120px;display:flex;align-items:center;justify-content:center}
.hero img{display:block;width:100%;max-height:48vh;object-fit:contain}
.hero-empty{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:92px;margin-top:6px;border:1px dashed var(--steel);border-radius:14px;color:var(--smoke);font-size:15px;font-weight:600}

/* Übung */
.ex-name{font:800 42px/0.95 var(--plate);letter-spacing:-.005em;margin:16px 0 8px;word-break:break-word}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--steel);font-size:13px;font-weight:600;color:var(--ash)}
.last{margin:18px 0 0;padding:12px 0 0;border-top:1px solid var(--steel)}
.last-label{font-size:14px;color:var(--ash)}
.last-sets{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:4px;font:600 21px/1.2 var(--plate);font-variant-numeric:tabular-nums}
.last-sets .dr{color:var(--ash)}

/* Sätze */
.sets{margin-top:22px}
.sets-head,.set-row,.drop-row{display:grid;grid-template-columns:38px 1fr 1fr 58px 48px;gap:8px;align-items:center}
.sets-head{font-size:13px;color:var(--smoke);font-weight:600;padding-bottom:8px}
.sets-head span{text-align:center}
.set{padding:9px 0;border-top:1px solid var(--steel)}
.set-no{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--iron);font:700 21px/1 var(--plate);color:var(--ash);font-variant-numeric:tabular-nums}
.inp{width:100%;height:48px;border-radius:10px;background:var(--iron);border:1px solid transparent;text-align:center;
  font:700 26px/1 var(--plate);font-variant-numeric:tabular-nums;color:var(--ash);caret-color:var(--chalk);outline:none;-webkit-appearance:none;appearance:none;padding:0 4px}
.inp::placeholder{color:var(--smoke);font-weight:500}
.inp:focus{border-color:var(--chalk);color:var(--chalk)}
.set.done .inp{color:var(--chalk);background:var(--black);border-color:var(--steel)}
.set.done .set-no{background:var(--chalk);color:var(--black)}
.drop-btn{display:flex;align-items:center;justify-content:center;height:38px;border-radius:9px;border:1px solid var(--steel);font-size:13px;font-weight:700;color:var(--ash);text-align:center}
.check{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--steel);display:flex;align-items:center;justify-content:center;color:var(--smoke)}
.set.done .check{background:var(--chalk);border-color:var(--chalk);color:var(--black)}
.drop-row{margin-top:8px}
.drop-mark{font:700 20px/1 var(--plate);color:var(--smoke);text-align:center}
.drop-row .inp{height:40px;font-size:21px}
.drop-row .icon-btn{width:38px;height:38px;justify-self:center}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* Aufklappbar */
.fold{border-bottom:1px solid var(--steel)}
.fold:first-of-type{margin-top:26px;border-top:1px solid var(--steel)}
.fold summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:54px;font-weight:600;cursor:pointer}
.fold summary::-webkit-details-marker{display:none}
.fold summary .chev{transition:transform .2s}
.fold[open] summary .chev{transform:rotate(90deg)}
.fold-body{padding:0 0 16px;color:var(--ash);font-size:15px}
.fold-text{white-space:pre-wrap;word-break:break-word;color:var(--chalk)}
.hist{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--iron)}
.hist:first-child{border-top:0}
.hist-sets{color:var(--chalk);font:600 19px/1.3 var(--plate);font-variant-numeric:tabular-nums}

.next{margin-top:28px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:14px;background:var(--chalk);color:var(--black);text-align:left}
.next small{display:block;font-size:13px;font-weight:600;opacity:.55}
.next strong{display:block;font:800 28px/1 var(--plate);margin-top:2px}

/* Formular */
.label{display:block;font-size:14px;color:var(--ash);font-weight:600;margin:24px 0 8px}
.label .opt{color:var(--smoke);font-weight:500}
.field{width:100%;height:52px;border-radius:12px;background:var(--iron);border:1px solid transparent;padding:0 14px;font-size:17px;outline:none;color:var(--chalk);caret-color:var(--chalk);-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--chalk)}
.field::placeholder{color:var(--smoke)}
textarea.field{height:auto;min-height:120px;padding:13px 14px;resize:vertical;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--steel);font-size:15px;font-weight:600;color:var(--ash)}
.chip.on{background:var(--chalk);color:var(--black);border-color:var(--chalk)}
.chip-add{border-style:dashed}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--iron);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:44px;padding:6px 8px;border-radius:9px;font-size:15px;font-weight:600;color:var(--ash);text-align:center;line-height:1.2}
.seg button.on{background:var(--chalk);color:var(--black)}
.img-pick{width:100%;margin-top:6px;border-radius:16px;overflow:hidden;border:1px dashed var(--steel);min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ash);font-weight:600;text-align:center}
.img-pick small{color:var(--smoke);font-weight:500;font-size:14px}
.img-pick.has{border:0;background:var(--black)}
.img-pick.has img{display:block;width:100%;max-height:320px;object-fit:contain}

/* Daten */
.note{border-left:2px solid var(--chalk);padding:2px 0 2px 14px;color:var(--ash);font-size:15px;margin:4px 0 8px}
.note b{color:var(--chalk);font-weight:600;display:block;margin-bottom:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:22px 0 10px;border-top:1px solid var(--steel);border-bottom:1px solid var(--steel)}
.stats div{padding:14px 0}
.stats b{display:block;font:800 34px/1 var(--plate)}
.stats span{font-size:13px;color:var(--ash)}

/* Sheet */
.sheet-wrap{position:fixed;left:0;right:0;top:0;height:100%;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.7);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:620px;margin:0 auto;background:var(--black);border-top:1px solid var(--steel);border-radius:20px 20px 0 0;
  padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .22s ease}
.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.open .sheet-bg{opacity:1}
.sheet-title{font:800 32px/1 var(--plate);margin:0 0 12px}
.sheet-text{color:var(--ash);margin:0 0 8px;font-size:15px}
.sheet .btn:first-of-type{margin-top:8px}
.sheet .rows{margin-top:6px}
.sheet .field{margin-top:14px}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--chalk);color:var(--black);
  padding:12px 18px;border-radius:999px;font-weight:600;font-size:15px;width:max-content;opacity:0;transition:opacity .2s,transform .2s;z-index:60;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.empty{padding:6px 0}
.empty p{color:var(--ash);margin:0 0 10px;font-size:16px;max-width:34em}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* V2: Bibliothek */
.seg3{grid-template-columns:repeat(3,1fr)}
.tabs{margin:2px 0 14px}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;margin:12px -18px 6px;padding:0 18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips-scroll::-webkit-scrollbar{display:none}
.chips-scroll .chip{flex:none;height:36px;font-size:14px}
.lib-row{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--steel)}
.lib-row .row{border-bottom:0;flex:1;min-width:0}
.info-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--steel);color:var(--ash);font:700 18px/1 var(--plate);flex:none}
.lib-imgs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 -18px}
.lib-imgs figure{margin:0;position:relative;background:var(--iron);aspect-ratio:3/2;overflow:hidden}
.lib-imgs img{width:100%;height:100%;object-fit:cover;display:block}
.lib-imgs figcaption{position:absolute;left:8px;bottom:8px;font-size:12px;font-weight:600;background:rgba(0,0,0,.7);padding:3px 8px;border-radius:6px}
.sub-en{color:var(--ash);font-size:15px;margin:0 0 12px}
.tag.sec{border-style:dashed;color:var(--smoke)}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:4px 0 0;font-size:15px}
.info dt{color:var(--smoke)}
.info dd{margin:0;color:var(--chalk)}
.info h3{font-size:15px;font-weight:700;color:var(--chalk);margin:18px 0 4px}
.info p{margin:0;color:var(--ash);line-height:1.5;max-width:36em}
.info .orig{color:var(--ash);margin:0 0 10px}
.mine-note{margin:18px 0 0;color:var(--ash);font-size:15px;display:flex;align-items:center;gap:8px}

/* V2: Ziele */
.goal{margin-top:18px;padding:14px 16px 16px;border-radius:14px;border:1px solid var(--steel)}
.goal-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ash)}
.goal-edit{font-size:15px;font-weight:600;color:var(--chalk);padding:6px 0 6px 12px}
.goal-val{font:800 32px/1 var(--plate);margin:2px 0 12px}
.track{position:relative;height:8px;border-radius:4px;background:var(--steel);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--chalk)}
.tick{position:absolute;top:0;bottom:0;width:2px;background:var(--black);z-index:1}
.goal-sub{font-size:14px;color:var(--ash);margin-top:9px}
.goal.ready{background:var(--chalk);color:var(--black);border-color:var(--chalk)}
.goal.ready .goal-top,.goal.ready .goal-sub{color:#4a4a4a}
.goal.ready .goal-edit{color:var(--black)}
.goal.ready .track{background:#cfcfcf}
.goal.ready .fill{background:var(--black)}
.goal.ready .btn-primary{background:var(--black);color:var(--chalk)}
.goal-add{margin-top:14px;display:inline-flex;align-items:center;gap:6px;color:var(--ash);font-size:15px;font-weight:600;height:40px}
.goal-add .i{width:18px;height:18px}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 4px}
.goal-grid label{font-size:13px;color:var(--ash);font-weight:600}
.goal-grid .field{margin-top:6px}

/* V2: Notizen */
.fold summary .sum-l{display:flex;align-items:center;gap:8px}
.note-field{min-height:110px;margin-top:2px}

/* V2: Auswertung */
.stats2{grid-template-columns:repeat(2,1fr)}
.bar-row{padding:12px 0;border-bottom:1px solid var(--steel)}
.bar-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:600}
.bar-head b{font:700 26px/1 var(--plate);font-variant-numeric:tabular-nums}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;padding:14px 0;border-bottom:1px solid var(--steel);text-align:left;font-size:15px}
.switch{width:50px;height:30px;border-radius:15px;background:var(--steel);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--chalk);transition:transform .2s}
.switch.on{background:var(--chalk)}
.switch.on::after{transform:translateX(20px);background:var(--black)}
.hint{font-size:14px;color:var(--ash);margin:14px 0 0;line-height:1.45}

/* V3a: Einheiten */
.live{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:16px 18px;margin:0 0 18px;border-radius:14px;background:var(--chalk);color:var(--black);text-align:left}
.live small{display:block;font-size:13px;font-weight:600;opacity:.55}
.live strong{display:block;font:800 30px/1 var(--plate);margin-top:2px}
.live-time{font:700 22px/1 var(--plate);font-variant-numeric:tabular-nums}
.btn-start{margin:4px 0 18px}
.idle{margin-top:18px;padding:16px;border:1px dashed var(--steel);border-radius:14px}
.idle p{margin:0 0 4px;color:var(--ash);font-size:15px}
.last-unit{margin:18px 0 0;font-size:14px;color:var(--ash)}
.unit-row{min-height:58px}

/* V3a: Satzzeilen mit Last und Plus/Minus */
.step-row{display:none;grid-template-columns:38px 1fr 1fr 58px 48px;gap:8px;margin-top:8px}
.set.act .step-row{display:grid}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.steps button{height:38px;border-radius:9px;background:var(--iron);font:700 17px/1 var(--plate);color:var(--chalk);font-variant-numeric:tabular-nums}
.steps button:active{background:var(--steel)}
.last-chip{display:block;margin:6px 0 0 46px;padding:2px 0;font-size:13px;color:var(--smoke);text-align:left;font-variant-numeric:tabular-nums}
.last-chip:not(.none){color:var(--ash)}
.last-chip .dr{color:var(--smoke)}
.set.act{background:linear-gradient(to right,transparent,transparent)}
.set.act .set-no{outline:1.5px solid var(--chalk);outline-offset:1px}
.set.done .inp::placeholder{color:var(--chalk)}

/* V3a: Verlauf */
.hgrid-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px;-webkit-overflow-scrolling:touch}
.hgrid{border-collapse:collapse;font-size:14px;white-space:nowrap}
.hgrid th{font-weight:600;color:var(--smoke);text-align:left;padding:0 18px 8px 0;font-size:13px}
.hgrid td{padding:9px 18px 9px 0;border-top:1px solid var(--iron);vertical-align:top;color:var(--chalk);font:600 18px/1.25 var(--plate);font-variant-numeric:tabular-nums}
.hgrid td.hdate{font:500 14px/1.3 var(--ui);color:var(--ash)}
.hgrid td .dr{display:block;font-size:15px;color:var(--ash)}
.hgrid tr{cursor:pointer}
.srow{padding:14px 0;border-bottom:1px solid var(--steel)}
.srow:first-of-type{border-top:1px solid var(--steel)}
.srow-name{font-weight:600;font-size:17px;margin-bottom:6px}
.srow-sets{display:flex;flex-wrap:wrap;gap:4px 18px;font:600 20px/1.25 var(--plate);font-variant-numeric:tabular-nums}
.srow-sets em{font-style:normal;color:var(--smoke);margin-right:6px}
.srow-sets .dr{color:var(--ash)}
.hero img.lib-hero{aspect-ratio:850/567}

/* V3a: Feinschliff */
.inp{color:var(--chalk)}
.set:not(.done) .inp{background:var(--iron)}
.fold .rows{border-top:0}
.fold .rows .row:last-child{border-bottom:0}
.steps button{font-size:19px}

/* V3b */
.plan-line{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin-top:14px;padding:12px 0;border-top:1px solid var(--steel);border-bottom:1px solid var(--steel);font-size:15px;color:var(--ash);text-align:left}
.plan-line b{color:var(--chalk);font:700 20px/1 var(--plate)}
.relstr{margin:10px 0 0;font-size:14px;color:var(--ash)}
.up{display:inline-block;margin-left:8px;font:700 15px/1 var(--plate);color:var(--black);background:var(--chalk);border-radius:6px;padding:3px 7px;vertical-align:2px}
.prog-row{min-height:60px}
.prog-row .up{font-size:20px;padding:4px 9px}
.rep-card{display:flex;align-items:stretch;gap:0;margin:0 0 18px;border:1px solid var(--steel);border-radius:14px;overflow:hidden}
.rep-main{flex:1;padding:14px 16px;text-align:left}
.rep-main small{display:block;font-size:13px;font-weight:600;color:var(--ash)}
.rep-main strong{display:block;font:800 24px/1.05 var(--plate);margin-top:4px}
.rep-main span{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;background:var(--chalk);color:var(--black);border-radius:6px;padding:3px 8px}
.rep-x{width:48px;display:flex;align-items:center;justify-content:center;color:var(--smoke);border-left:1px solid var(--steel)}
.eyebrow-date{margin:16px 0 0;font-size:14px;color:var(--ash)}
.rep-hero{margin:8px 0 6px}
.rep-hero b{display:block;font:800 72px/0.9 var(--plate);letter-spacing:-.01em}
.rep-hero span{font-size:15px;color:var(--ash)}
.gag{font-size:17px;margin:12px 0 4px;line-height:1.4}
.body-now{margin:20px 0 8px}
.body-now b{display:block;font:800 56px/0.95 var(--plate)}
.body-now span{font-size:14px;color:var(--ash)}
.chart{width:100%;height:auto;color:var(--chalk);display:block;margin-top:8px}
.chart-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--smoke);margin-top:4px}
.ana-row{padding:14px 0;border-bottom:1px solid var(--steel)}
.ana-track{overflow:visible}
.ana-track .zone{position:absolute;top:-3px;bottom:-3px;border-radius:3px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35)}
.ana-track .fill{border-radius:4px;opacity:.95}
.ana-sub{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;font-size:13px;color:var(--ash)}
.badge{font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;border:1px solid var(--steel);color:var(--chalk)}
.ana-row.good .badge{background:var(--chalk);color:var(--black);border-color:var(--chalk)}
.ana-row.low .badge{border-color:var(--danger);color:var(--danger)}
.ana-row.high .badge{border-style:dashed}
.ana-note{margin:8px 0 0;font-size:13px;color:var(--smoke)}
.note span{display:block;margin-top:2px}

/* V4.2: aktueller Plan */
.cur-plan{border:1px solid var(--steel);border-radius:18px;overflow:hidden;margin-bottom:6px}
.cur-head{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:16px 16px 14px;text-align:left}
.cur-head small{display:block;font-size:13px;font-weight:600;color:var(--ash)}
.cur-head strong{display:block;font:800 36px/0.95 var(--plate);margin-top:4px;word-break:break-word}
.cur-days{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--steel);border-top:1px solid var(--steel)}
.cur-day{background:var(--black);padding:16px;text-align:left;min-height:86px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.cur-day:active{background:var(--iron)}
.cd-name{font:800 30px/0.95 var(--plate);word-break:break-word}
.cd-meta{font-size:13px;color:var(--ash)}
.cur-day.live-day{background:var(--chalk);color:var(--black)}
.cur-day.live-day .cd-meta{color:#444;font-weight:600}
.cur-days .cur-day:last-child:nth-child(odd){grid-column:1/-1}

/* V4.2: Fotos */
.photo-bar{display:flex;gap:8px;overflow-x:auto;margin:4px -18px 18px;padding:0 18px;scrollbar-width:none}
.photo-bar::-webkit-scrollbar{display:none}
.photo-thumb{flex:none;width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--iron)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-add{flex:1 0 auto;min-width:150px;height:76px;border-radius:12px;border:1px dashed var(--steel);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ash);font-weight:600;font-size:15px;padding:0 16px}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;scrollbar-width:none;background:var(--black)}
.gallery::-webkit-scrollbar{display:none}
.gal-item{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;max-height:62vh}
.gal-item img{width:100%;max-height:62vh;object-fit:contain;display:block}
.gal-hint{font-size:13px;color:var(--smoke);margin:8px 0 0;text-align:center}
.photo-full{width:100%;max-height:70vh;object-fit:contain;display:block;border-radius:12px;background:var(--black)}
.idle-note{margin:16px 0 0;padding:14px 16px;border:1px dashed var(--steel);border-radius:14px;color:var(--ash);font-size:15px}
.bar-btn .i{width:24px;height:24px}

.steps button{display:flex;align-items:center;justify-content:center;text-align:center;font-size:26px;line-height:1}

/* V4.3: Körpermodell */
.model-card{margin-top:18px;border:1px solid var(--steel);border-radius:18px;padding:14px 12px 10px}
.model-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ash);padding:0 4px}
.model-del{font-size:14px;font-weight:600;color:var(--danger);padding:6px 0 6px 12px}
.body-model{width:100%;height:auto;display:block;margin-top:6px}
.bm-figure path,.bm-figure ellipse,.bm-figure rect{fill:var(--iron);stroke:var(--chalk);stroke-width:1.6;stroke-linejoin:round}
.bm-figure .bm-detail{fill:none;stroke:var(--smoke);stroke-width:1.2;stroke-linecap:round}
.bm-lead{stroke:var(--smoke);stroke-width:1;stroke-dasharray:2 3}
.bm-measure{stroke:var(--chalk);stroke-width:2;stroke-linecap:round}
.bm-hit{fill:transparent}
.bm-field{cursor:pointer}
.bm-name{fill:var(--ash);font:600 12px var(--ui)}
.bm-val{fill:var(--chalk);font:800 25px var(--plate)}
.bm-unit{fill:var(--ash);font:600 13px var(--ui)}
.bm-delta{fill:var(--chalk);font:700 13px var(--plate)}
.bm-field.old .bm-val{fill:var(--smoke)}
.bm-field.old .bm-measure{stroke:var(--smoke)}
.bm-field.none .bm-val{fill:var(--smoke)}
.bm-field.none .bm-measure{stroke:var(--steel)}
.model-hint{font-size:13px;color:var(--smoke);margin:6px 4px 2px;line-height:1.4}
.row-sel .row-title{text-decoration:underline;text-underline-offset:4px}
.plan-line small{display:block;font-size:12px;color:var(--smoke);margin-top:2px}
.hday{display:block;font-size:12px;color:var(--smoke);margin-top:2px}
.bm-figure{pointer-events:none}
.bm-hitline{stroke:transparent;stroke-width:26}
.chart-legend{gap:8px}
.chart-legend span:nth-child(2){text-align:center;flex:1}

/* V4.4: Stärke */
.lvl-row{padding:14px 0;border-bottom:1px solid var(--steel)}
.lvl-track{height:10px}
.lvl-track .tick{width:2px}
.lvl-scale{display:grid;grid-template-columns:repeat(5,1fr);margin:6px 0 0 calc(100% / 6 - 4%);font-size:11px;color:var(--smoke)}
.badge.lvl{background:var(--chalk);color:var(--black);border-color:var(--chalk)}
.spark{width:84px;height:26px;color:var(--chalk);flex:none}
.stag{display:inline-block;font-size:12px;font-weight:700;border:1px dashed var(--ash);color:var(--chalk);border-radius:6px;padding:1px 6px}
.relstr b{color:var(--chalk)}

/* V4.5: Rekorde */
.set-row{position:relative}
.pr{position:absolute;right:-6px;top:-8px;height:20px;padding:0 6px;border-radius:999px;background:var(--black);color:var(--chalk);border:1.5px solid var(--chalk);font:800 12px/1 var(--plate);letter-spacing:.04em;display:flex;align-items:center;animation:prpop .35s ease-out}
@keyframes prpop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.pr-tag{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:6px;background:var(--chalk);color:var(--black);font:800 12px/1 var(--plate);vertical-align:3px;cursor:pointer}
.pr-tag.big{font-size:17px;padding:5px 9px;margin-left:8px}
.pr-thumb{background:var(--chalk);color:var(--black);font:800 18px/1 var(--plate)}
.rec-table{width:100%;border-collapse:collapse;font-size:15px}
.rec-table td{padding:9px 0;border-top:1px solid var(--iron);color:var(--ash);vertical-align:baseline}
.rec-table tr:first-child td{border-top:0}
.rec-table td:nth-child(2){color:var(--chalk);font:700 20px/1.2 var(--plate);text-align:right;padding-right:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec-table td:nth-child(3){text-align:right;font-size:13px;color:var(--smoke);white-space:nowrap}
.bm-img{opacity:.95}

/* V4.6: Zurück wischen */
body.swiping{overflow:hidden}
body.swiping #app{position:relative;z-index:2;background:var(--black);min-height:100vh;box-shadow:-12px 0 24px rgba(0,0,0,.6),-1px 0 0 var(--steel);will-change:transform}
#under{position:fixed;inset:0;z-index:1;background:var(--black);overflow:hidden;padding-top:env(safe-area-inset-top,0px);will-change:transform;pointer-events:none}
.app-clone{max-width:620px;margin:0 auto;padding:0 18px}
.under-bar{position:relative;z-index:2;background:var(--black)}
.under-bar .bar{position:relative;top:0}
.under-body{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 50px);bottom:0;overflow:hidden}
.under-shade{position:absolute;inset:0;background:#000;opacity:.55;z-index:3}

/* V4.7: Scroll-Balken ausblenden (Seite, Fenster, Tabellen) */
html,*{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0;background:transparent}

/* V4.8: vorgemerkte Werte in Grau */
.inp.ghost::placeholder{color:var(--ash);font-weight:700;opacity:1}
.set.has-ghost:not(.done) .check{border-color:var(--ash);color:var(--ash)}

/* V4.9: Startseite hat keine Kopfleiste, Vorschau beim Zurückwischen ohne Versatz */
#under.no-bar .under-bar{display:none}
#under.no-bar .under-body{top:env(safe-area-inset-top,0px)}
</style>
